<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vantajs</title>
<style>
  :root {
    --ink: #f6f6f9;
    --muted: #c9c9d6;
    --accent: #6ee7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #0b1220;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    overflow-x: hidden;
  }
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
  }
  .logo { font-weight: 700; font-size: 15px; }
  .logo span { color: var(--accent); }
  .nav ul { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--muted); }
  .nav a { color: inherit; text-decoration: none; }
  .nav .cta {
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--accent);
    color: #04222b;
    font-size: 13px;
    font-weight: 700;
  }
  #hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 720px;
  }
  .hero-content .eyebrow {
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero-content h1 {
    font-size: clamp(34px, 6vw, 60px);
    line-height: 1.05;
    margin: 0 0 20px;
    font-weight: 700;
    letter-spacing: -1.6px;
  }
  .hero-content p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 auto 32px;
    max-width: 460px;
  }
  .btn-primary {
    padding: 14px 28px;
    border-radius: 10px;
    background: var(--accent);
    color: #04222b;
    font-weight: 700;
    font-size: 14px;
    border: none;
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="logo">mesh<span>work</span></div>
    <ul>
      <li><a href="#">Network</a></li>
      <li><a href="#">API</a></li>
      <li><a href="#">Pricing</a></li>
    </ul>
    <div class="cta">Get API key</div>
  </nav>

  <section id="hero">
    <div class="hero-content">
      <div class="eyebrow">Distributed compute mesh</div>
      <h1>Every node connected. Every request instant.</h1>
      <p>A living network of points and connections renders in real time behind this hero, powered by Vanta.js and three.js.</p>
      <button class="btn-primary">Read the whitepaper</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    let effect = null;

    function initVanta() {
      if (effect) effect.destroy();
      effect = VANTA.NET({
        el: "#hero",
        THREE,
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0x6ee7ff,
        backgroundColor: 0x0b1220,
        points: 11.0,
        maxDistance: 22.0,
        spacing: 17.0,
        showDots: true,
      });
    }

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.getElementById("hero").style.background =
        "radial-gradient(circle at 50% 30%, #16233b 0%, #0b1220 70%)";
    } else {
      initVanta();
    }

    window.addEventListener("beforeunload", () => {
      if (effect) effect.destroy();
    });
  </script>
</body>
</html>
