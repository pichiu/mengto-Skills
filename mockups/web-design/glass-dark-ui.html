<title>glass-dark-ui</title>
<style>
  :root {
    --bg-0: #020617;
    --bg-1: #0b1220;
    --glass-fill: rgba(15, 23, 42, 0.45);
    --glass-fill-strong: rgba(15, 23, 42, 0.62);
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #60a5fa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(96, 165, 250, 0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.14), transparent 50%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--text-main);
    padding: 48px 24px 80px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 8px;
  }

  p.lead {
    text-align: center;
    color: var(--text-muted);
    margin: 0 0 48px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 28px;
    max-width: 1100px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  figure {
    margin: 0;
  }

  .border-gradient {
    position: relative;
  }

  .border-gradient::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    background: linear-gradient(
      145deg,
      rgba(148, 163, 184, 0.28) 0%,
      rgba(96, 165, 250, 0.36) 45%,
      rgba(168, 85, 247, 0.3) 70%,
      rgba(148, 163, 184, 0.18) 100%
    );
    pointer-events: none;
  }

  .glass-panel {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
    background-color: var(--glass-fill);
    border-radius: 24px;
    box-shadow: 0 20px 48px rgba(2, 6, 23, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    padding: 28px;
    height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .glass-panel h2 {
    margin: 0 0 8px;
    font-size: 19px;
  }

  .glass-panel p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-main);
    background: var(--glass-fill-strong);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: box-shadow 160ms ease, transform 160ms ease, outline-color 160ms ease;
    outline: 1px solid transparent;
  }

  .btn.primary {
    background: linear-gradient(180deg, rgba(96, 165, 250, 0.45), rgba(96, 165, 250, 0.18));
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(2, 6, 23, 0.4);
  }

  .btn:focus-visible {
    outline-color: var(--accent);
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 22px;
    border-radius: 18px;
  }

  .navbar .brand {
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .navbar nav {
    display: flex;
    gap: 18px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .navbar nav a {
    color: var(--text-muted);
    text-decoration: none;
  }

  .navbar nav a.active {
    color: var(--text-main);
  }

  figcaption {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 14px;
    line-height: 1.4;
  }
</style>

<h1>Glass Dark UI</h1>
<p class="lead">Frosted dark surfaces with masked gradient borders</p>

<div class="grid">
  <figure>
    <div class="glass-panel border-gradient">
      <h2>Frosted Card</h2>
      <p>backdrop-filter blur + saturate over a deep navy fill, with an inset highlight for glass thickness.</p>
      <div class="btn-row">
        <button class="btn primary">Continue</button>
        <button class="btn">Cancel</button>
      </div>
    </div>
    <figcaption>Glass panel + gradient border mask + button states</figcaption>
  </figure>

  <figure>
    <div class="glass-panel border-gradient" style="height:auto; padding:0;">
      <div class="navbar">
        <span class="brand">Nova</span>
        <nav>
          <a href="#" class="active">Home</a>
          <a href="#">Docs</a>
          <a href="#">Pricing</a>
        </nav>
      </div>
    </div>
    <div class="glass-panel border-gradient" style="height:150px; margin-top:20px;">
      <h2 style="font-size:16px;">Dashboard Tile</h2>
      <p>Restrained glow and shadow keep the panel premium without sacrificing legibility.</p>
    </div>
    <figcaption>Glass navbar stacked above a compact dashboard tile</figcaption>
  </figure>

  <figure>
    <div class="glass-panel border-gradient" style="height:220px; background-color: var(--glass-fill-strong);">
      <h2>Modal Surface</h2>
      <p style="color:#cbd5e1;">Stronger fallback fill (<code>--glass-fill-strong</code>) for contexts without backdrop-filter support.</p>
      <div class="btn-row">
        <button class="btn primary">Confirm</button>
      </div>
    </div>
    <figcaption>Stronger glass fill used as a non-blur fallback surface</figcaption>
  </figure>
</div>
