<title>css-border-gradient</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0f;
    color: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: clamp(24px, 6vw, 64px) clamp(16px, 5vw, 48px);
  }
  h1 { font-size: clamp(22px, 3vw, 28px); margin: 0 0 8px; letter-spacing: -0.01em; }
  p.lede { margin: 0 0 40px; color: #9a9aa5; max-width: 60ch; font-size: 15px; line-height: 1.5; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 32px;
  }
  figure { margin: 0; display: flex; flex-direction: column; gap: 14px; }
  figcaption { font-size: 13px; color: #9a9aa5; line-height: 1.5; }

  .gradient-border {
    --surface: rgba(20, 20, 30, 0.75);
    --border-a: rgba(255, 255, 255, 0.34);
    --border-b: rgba(125, 92, 255, 0.36);
    --border-c: rgba(255, 255, 255, 0.08);
    border: 1px solid transparent;
    border-radius: 20px;
    padding: 22px;
    background:
      linear-gradient(var(--surface), var(--surface)) padding-box,
      linear-gradient(135deg, var(--border-a), var(--border-b), var(--border-c)) border-box;
  }
  .gradient-border h3 { margin: 0 0 8px; font-size: 15px; }
  .gradient-border p { margin: 0; font-size: 13px; color: #b6b6c0; line-height: 1.5; }

  .noise-panel {
    position: relative;
    border-radius: 20px;
    padding: 22px;
    background:
      radial-gradient(120% 140% at 10% 0%, rgba(125,92,255,0.16), transparent 55%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 4px),
      #14141e;
    overflow: hidden;
  }
  .noise-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(145deg, rgba(255,255,255,0.34), rgba(125,92,255,0.36) 45%, rgba(255,255,255,0.08));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .noise-panel h3 { margin: 0 0 8px; font-size: 15px; position: relative; }
  .noise-panel p { margin: 0; font-size: 13px; color: #b6b6c0; line-height: 1.5; position: relative; }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    font-size: 13px;
    color: #9a9aa5;
    border-radius: 10px;
    border: 1px solid transparent;
  }
  .tab.active {
    color: #f4f4f6;
    background:
      linear-gradient(rgba(28,28,38,0.9), rgba(28,28,38,0.9)) padding-box,
      linear-gradient(135deg, rgba(255,255,255,0.34), rgba(125,92,255,0.4), rgba(255,255,255,0.08)) border-box;
    border: 1px solid transparent;
  }

  .pricing-card {
    border-radius: 22px;
    padding: 24px;
    background:
      linear-gradient(rgba(18,18,26,0.9), rgba(18,18,26,0.9)) padding-box,
      linear-gradient(160deg, rgba(255,255,255,0.4), rgba(125,92,255,0.4) 50%, rgba(255,255,255,0.06)) border-box;
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pricing-card span.tag {
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a78bfa;
  }
  .pricing-card h3 { margin: 0; font-size: 22px; }
  .pricing-card p { margin: 0; font-size: 13px; color: #b6b6c0; }
</style>
<body>
  <h1>CSS Border Gradient</h1>
  <p class="lede">A quiet gradient edge for premium surfaces — neutral highlight, one brand accent, neutral fade, never a loud glow.</p>
  <div class="grid">
    <figure>
      <div class="gradient-border">
        <h3>Simple pattern</h3>
        <p>Double background trick on a translucent surface — solid fill in the padding box, gradient in the border box.</p>
      </div>
      <figcaption>Use when the surface has a flat or translucent fill; the border and background are set together in one rule.</figcaption>
    </figure>
    <figure>
      <div class="noise-panel">
        <h3>Masked pattern</h3>
        <p>The card's own background stays untouched — a pseudo-element supplies the gradient border via mask-composite.</p>
      </div>
      <figcaption>Use when the surface already has a complex background that a padding-box fill would overwrite.</figcaption>
    </figure>
    <figure>
      <div class="tabs">
        <div class="tab active">Overview</div>
        <div class="tab">Usage</div>
        <div class="tab">Billing</div>
      </div>
      <figcaption>Active tab gets the gradient border as a quiet selected-state accent, inactive tabs stay flat.</figcaption>
    </figure>
    <figure>
      <div class="pricing-card">
        <span class="tag">Pro plan</span>
        <h3>$24/mo</h3>
        <p>2px border for the selected plan — the one place a stronger width is justified.</p>
      </div>
      <figcaption>Selected pricing tier: 2px width reserved for this one hierarchy level, still under 0.4 opacity per stop.</figcaption>
    </figure>
  </div>
</body>
