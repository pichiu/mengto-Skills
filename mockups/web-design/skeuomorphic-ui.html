<title>skeuomorphic-ui</title>
<style>
  :root {
    --sk-bg-top: #f8fafc;
    --sk-bg-mid: #e9eef5;
    --sk-bg-bottom: #cfd7e4;
    --sk-edge-top: rgba(255, 255, 255, 0.82);
    --sk-edge-bottom: rgba(79, 93, 122, 0.34);
    --sk-shadow: rgba(31, 41, 55, 0.18);
    --sk-shadow-deep: rgba(31, 41, 55, 0.28);
    --sk-highlight: rgba(255, 255, 255, 0.72);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #eef1f6, #dfe4ec);
    color: #334155;
    padding: 48px 24px 80px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin: 0 0 8px;
    color: #1e293b;
  }

  p.lead {
    text-align: center;
    color: #64748b;
    margin: 0 0 48px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 32px;
    max-width: 1100px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  figure { margin: 0; }

  figcaption {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-top: 16px;
    line-height: 1.4;
  }

  .sk-surface {
    position: relative;
    border: 1px solid transparent;
    border-radius: 22px;
    background:
      linear-gradient(180deg, var(--sk-bg-top), var(--sk-bg-mid) 48%, var(--sk-bg-bottom)) padding-box,
      linear-gradient(180deg, var(--sk-edge-top), rgba(255, 255, 255, 0.22) 45%, var(--sk-edge-bottom)) border-box;
    box-shadow:
      0 18px 34px var(--sk-shadow),
      0 5px 12px rgba(31, 41, 55, 0.12),
      inset 0 1px 0 var(--sk-highlight),
      inset 0 -1px 0 rgba(79, 93, 122, 0.24);
    transition: box-shadow 200ms ease, transform 200ms ease, background 200ms ease;
  }

  .sk-surface::after {
    content: "";
    position: absolute;
    inset: 1px 1px auto;
    height: 35%;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent);
    pointer-events: none;
  }

  .sk-surface.is-pressed {
    transform: translateY(1px);
    background:
      linear-gradient(180deg, #d5dce8, #eef2f7 52%, #f8fafc) padding-box,
      linear-gradient(180deg, rgba(72, 84, 112, 0.38), rgba(255, 255, 255, 0.62)) border-box;
    box-shadow:
      inset 0 4px 10px rgba(31, 41, 55, 0.22),
      inset 0 -1px 0 rgba(255, 255, 255, 0.72),
      0 4px 10px rgba(31, 41, 55, 0.10);
  }

  .sk-label {
    color: #334155;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.78), 0 -1px 0 rgba(31, 41, 55, 0.12);
  }

  .sk-texture {
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.34) 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 65%, rgba(31, 41, 55, 0.08) 0 1px, transparent 1.5px);
    background-size: 18px 18px, 22px 22px;
  }

  .card-demo {
    height: 220px;
    padding: 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
  }

  .card-demo h2 {
    margin: 0;
    font-size: 18px;
  }

  .card-demo p {
    margin: 0;
    font-size: 13px;
    color: #64748b;
    line-height: 1.5;
  }

  .btn-demo {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-direction: column;
  }

  .sk-btn {
    padding: 14px 30px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    border: none;
  }

  .switch-demo {
    height: 220px;
    padding: 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .switch-row span {
    font-size: 13px;
    font-weight: 600;
  }

  .sk-toggle {
    width: 54px;
    height: 30px;
    border-radius: 999px;
    position: relative;
    background:
      linear-gradient(180deg, #d5dce8, #eef2f7 52%, #f8fafc) padding-box,
      linear-gradient(180deg, rgba(72, 84, 112, 0.38), rgba(255, 255, 255, 0.62)) border-box;
    border: 1px solid transparent;
    box-shadow:
      inset 0 3px 8px rgba(31, 41, 55, 0.2),
      inset 0 -1px 0 rgba(255, 255, 255, 0.72);
  }

  .sk-toggle.on {
    background:
      linear-gradient(180deg, #bcd4ff, #8fb6f2 52%, #6f9ce0) padding-box,
      linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(72, 84, 112, 0.38)) border-box;
  }

  .sk-toggle-knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #dbe2ee);
    box-shadow: 0 3px 6px rgba(31, 41, 55, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    transition: left 200ms ease;
  }

  .sk-toggle.on .sk-toggle-knob {
    left: 27px;
  }

  .sk-dial {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 0 auto;
  }
</style>

<h1>Skeuomorphic UI</h1>
<p class="lead">Tactile surfaces built from layered gradients, stacked shadows, and reflective edges</p>

<div class="grid">
  <figure>
    <div class="sk-surface card-demo sk-texture">
      <h2 class="sk-label">Soft Plastic Card</h2>
      <p>Vertical gradient, 1px reflective border, outer elevation shadow, inset top highlight, and micro texture felt at low opacity.</p>
    </div>
    <figcaption>Raised surface recipe: gradient + border + stacked shadows + texture</figcaption>
  </figure>

  <figure>
    <div class="sk-surface btn-demo">
      <button class="sk-surface sk-btn sk-label">Press Me</button>
      <button class="sk-surface sk-btn sk-label is-pressed">Pressed</button>
    </div>
    <figcaption>Raised vs. pressed button: inset shadows and a 1px translateY reverse the depth on press</figcaption>
  </figure>

  <figure>
    <div class="sk-surface switch-demo">
      <div class="switch-row">
        <span class="sk-label">Wi-Fi</span>
        <div class="sk-toggle on"><div class="sk-toggle-knob"></div></div>
      </div>
      <div class="switch-row">
        <span class="sk-label">Bluetooth</span>
        <div class="sk-toggle"><div class="sk-toggle-knob"></div></div>
      </div>
    </div>
    <figcaption>Tactile toggle switches: carved inset track, glossy raised knob, light from top throughout</figcaption>
  </figure>
</div>
