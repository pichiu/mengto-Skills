<title>corner-diagonals</title>
<style>
  :root {
    --corner-cut-sm: 8px;
    --corner-cut-md: 14px;
    --corner-cut-lg: 24px;
    --corner-line: rgba(255, 255, 255, 0.18);
    --corner-line-strong: rgba(255, 255, 255, 0.34);
    --corner-fill: rgba(10, 14, 24, 0.82);
    --corner-accent: #8b5cf6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0f;
    color: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: clamp(24px, 6vw, 64px) clamp(16px, 5vw, 48px);
  }
  h1 { font-size: clamp(22px, 3vw, 28px); margin: 0 0 8px; letter-spacing: -0.01em; }
  p.lede { margin: 0 0 40px; color: #9a9aa5; max-width: 60ch; font-size: 15px; line-height: 1.5; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 32px;
    align-items: start;
  }
  figure { margin: 0; display: flex; flex-direction: column; gap: 14px; }
  figcaption { font-size: 13px; color: #9a9aa5; line-height: 1.5; }

  .cut-shell {
    --cut: var(--corner-cut-md);
    --border-size: 1px;
    position: relative;
    padding: var(--border-size);
    background: linear-gradient(135deg, var(--corner-line-strong), transparent 46%, var(--corner-line));
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .cut-shell__inner {
    min-height: 100%;
    padding: clamp(18px, 2.4vw, 26px);
    background: var(--corner-fill);
    clip-path: inherit;
  }
  .cut-shell__inner h3 { margin: 0 0 8px; font-size: 15px; }
  .cut-shell__inner p { margin: 0; font-size: 13px; color: #b6b6c0; line-height: 1.5; }

  .cut-button {
    --cut: var(--corner-cut-sm);
    position: relative;
    display: inline-flex;
    min-height: 44px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 20px;
    border: 0;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, var(--corner-accent), color-mix(in srgb, var(--corner-accent), black 28%));
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .cut-button:hover { filter: brightness(1.08); }
  .cut-button:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--corner-accent), white 45%);
    outline-offset: 3px;
  }
  .cut-button-secondary {
    --cut: var(--corner-cut-sm);
    color: white;
    font-size: 14px;
    font-weight: 600;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    background:
      linear-gradient(var(--corner-fill), var(--corner-fill)) padding-box,
      linear-gradient(135deg, var(--corner-line-strong), transparent 58%, var(--corner-accent)) border-box;
    border: 1px solid transparent;
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .button-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

  .cut-panel {
    --cut: var(--corner-cut-lg);
    position: relative;
    padding: 1px;
    background: linear-gradient(135deg, var(--corner-line-strong), transparent 46%, var(--corner-line));
    clip-path: polygon(
      var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut),
      100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%,
      var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)
    );
  }
  .cut-panel__inner {
    background: var(--corner-fill);
    clip-path: inherit;
    padding: clamp(24px, 4vw, 40px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }
  .cut-panel__inner span {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--corner-accent);
  }
  .cut-panel__inner h3 { margin: 0; font-size: 18px; }

  .cut-card {
    --cut: var(--corner-cut-md);
    position: relative;
    padding: clamp(18px, 2.4vw, 26px);
    background: var(--corner-fill);
    border: 1px solid var(--corner-line);
    clip-path: polygon(
      0 0, calc(100% - var(--cut)) 0, 100% var(--cut),
      100% 100%, var(--cut) 100%, 0 100%
    );
  }
  .cut-card h3 { margin: 0 0 8px; font-size: 15px; }
  .cut-card p { margin: 0; font-size: 13px; color: #b6b6c0; line-height: 1.5; }
</style>
<body>
  <h1>Corner Diagonals</h1>
  <p class="lede">Diagonal-cut corners applied consistently across buttons, cards, and panels — engineered, sharp, and reused as one repeated motif.</p>
  <div class="grid">
    <figure>
      <div class="cut-shell">
        <div class="cut-shell__inner">
          <h3>Bordered shell</h3>
          <p>Gradient border with a single chamfered corner pair, matched inner and outer geometry.</p>
        </div>
      </div>
      <figcaption>Outer wrapper plus inner surface share the same polygon so the border reads as one continuous cut.</figcaption>
    </figure>
    <figure>
      <div class="button-row">
        <button class="cut-button">Primary</button>
        <button class="cut-button-secondary">Secondary</button>
      </div>
      <figcaption>Primary and secondary buttons reuse the same small cut size — border, fill, and hit area follow one geometry.</figcaption>
    </figure>
    <figure>
      <div class="cut-panel">
        <div class="cut-panel__inner">
          <span>Sci-fi panel</span>
          <h3>Large section, all corners cut</h3>
        </div>
      </div>
      <figcaption>A larger cut size (24px) on all eight corners for hero panels — proportional to the bigger surface.</figcaption>
    </figure>
    <figure>
      <div class="cut-card">
        <h3>Mirrored card</h3>
        <p>Top-right and bottom-left chamfers, paired diagonally for a stable silhouette.</p>
      </div>
      <figcaption>Only two opposite corners clipped — the mirrored pairing keeps the shape legible at a glance.</figcaption>
    </figure>
  </div>
</body>
