<title>marquee-loop</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0f;
    color: #f1f5f9;
    padding: 48px 0 80px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    margin: 0 0 8px;
  }

  p.lead {
    text-align: center;
    color: #8b93a7;
    margin: 0 0 48px;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 56px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
  }

  figure { margin: 0; }

  figcaption {
    text-align: center;
    color: #8b93a7;
    font-size: 13px;
    margin-top: 16px;
    line-height: 1.4;
  }

  .marquee {
    position: relative;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 22s linear infinite;
  }

  .marquee:hover .marquee-track {
    animation-play-state: paused;
  }

  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation-duration: 90s; }
  }

  .logo-chip {
    flex: 0 0 auto;
    width: 160px;
    height: 72px;
    margin: 0 12px;
    border-radius: 14px;
    background: #14141c;
    border: 1px solid #232332;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #cbd2e1;
  }

  .tag-chip {
    flex: 0 0 auto;
    margin: 0 8px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #14141c;
    border: 1px solid #232332;
    font-size: 13px;
    color: #cbd2e1;
    white-space: nowrap;
  }

  .quote-card {
    flex: 0 0 auto;
    width: 280px;
    margin: 0 12px;
    padding: 20px;
    border-radius: 16px;
    background: #14141c;
    border: 1px solid #232332;
  }

  .quote-card p {
    margin: 0 0 12px;
    font-size: 13px;
    color: #cbd2e1;
    line-height: 1.5;
  }

  .quote-card .who {
    font-size: 12px;
    color: #7c8399;
    font-weight: 600;
  }

  .marquee-track.reverse {
    animation-direction: reverse;
  }
</style>

<h1>Marquee Loop</h1>
<p class="lead">Seamless infinite loops built from duplicated items</p>

<div class="stack">
  <figure>
    <div class="marquee">
      <div class="marquee-track">
        <div class="logo-chip">ACME</div>
        <div class="logo-chip">Vertex</div>
        <div class="logo-chip">Nimbus</div>
        <div class="logo-chip">Halcyon</div>
        <div class="logo-chip">Quartz</div>
        <div class="logo-chip">Ferro</div>
        <div class="logo-chip">ACME</div>
        <div class="logo-chip">Vertex</div>
        <div class="logo-chip">Nimbus</div>
        <div class="logo-chip">Halcyon</div>
        <div class="logo-chip">Quartz</div>
        <div class="logo-chip">Ferro</div>
      </div>
    </div>
    <figcaption>Logo strip: sequence duplicated once, track animates 0 to -50% so the loop is invisible. Edges fade with a mask gradient.</figcaption>
  </figure>

  <figure>
    <div class="marquee">
      <div class="marquee-track reverse" style="animation-duration: 16s;">
        <span class="tag-chip">#design-systems</span>
        <span class="tag-chip">#glassmorphism</span>
        <span class="tag-chip">#motion</span>
        <span class="tag-chip">#typography</span>
        <span class="tag-chip">#dark-mode</span>
        <span class="tag-chip">#accessibility</span>
        <span class="tag-chip">#design-systems</span>
        <span class="tag-chip">#glassmorphism</span>
        <span class="tag-chip">#motion</span>
        <span class="tag-chip">#typography</span>
        <span class="tag-chip">#dark-mode</span>
        <span class="tag-chip">#accessibility</span>
      </div>
    </div>
    <figcaption>Tag chips running the opposite direction at a different speed. Hover pauses the loop since chips are short and glanceable, not read carefully.</figcaption>
  </figure>

  <figure>
    <div class="marquee">
      <div class="marquee-track" style="animation-duration: 30s;">
        <div class="quote-card"><p>"Shipped our rebrand twice as fast."</p><div class="who">— Mia, Product Lead</div></div>
        <div class="quote-card"><p>"The system finally feels consistent."</p><div class="who">— Theo, Design Ops</div></div>
        <div class="quote-card"><p>"Our engineers stopped guessing spacing."</p><div class="who">— Ren, Frontend</div></div>
        <div class="quote-card"><p>"Shipped our rebrand twice as fast."</p><div class="who">— Mia, Product Lead</div></div>
        <div class="quote-card"><p>"The system finally feels consistent."</p><div class="who">— Theo, Design Ops</div></div>
        <div class="quote-card"><p>"Our engineers stopped guessing spacing."</p><div class="who">— Ren, Frontend</div></div>
      </div>
    </div>
    <figcaption>Testimonial cards: fixed widths keep the loop stable, slower speed keeps short quotes readable without becoming primary reading content.</figcaption>
  </figure>
</div>
