      }));
      return formWrap;
    }

    var row = document.createElement('div');
    row.className = 'org-dict-row' + (isLast ? '' : ' container-line');

    var name = document.createElement('span');
    name.className = 'org-name';
    name.innerHTML = esc(d.name) + statusBadgeHtml(d);
    row.appendChild(name);

    var actions = document.createElement('div');
    actions.className = 'org-row-actions';

    var renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'btn ghost';
    renameBtn.textContent = '改名';
    renameBtn.setAttribute('aria-label', '改名 · ' + d.name);

      uiState.renameTarget = { kind: 'dept', id: d.id };
      uiState.addingDept = false;
      draw(container);
    });

    var deactivateBtn = document.createElement('button');
    deactivateBtn.type = 'button';
    deactivateBtn.className = 'btn ghost';

      deactivateNode(d, d.name, container);

  function buildDeptsCard(container) {
    var card = document.createElement('div');
    card.className = 'card';

    var head = document.createElement('div');
    head.className = 'row-between';
    head.innerHTML =
      '<div><h2 class="section-title" style="margin-bottom:2px;">處室字典</h2>' +
      '<p class="section-sub" style="margin:0;">同名或停用「使用中」處室會出現 409 提示；示意用途，不寫回資料。</p></div>';
    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn btn-primary';
    addBtn.textContent = '新增處室';
    addBtn.addEventListener('click', function () {
      uiState.addingDept = true;
      uiState.renameTarget = null;
      draw(container);
    });
    head.appendChild(addBtn);
    card.appendChild(head);

    var list = document.createElement('div');
    list.style.marginTop = 'var(--sp-3)';

    if (uiState.addingDept) {
      list.appendChild(buildInlineForm({
        label: '新增處室',
        submitLabel: '新增',
        onSubmit: function (name) { addDept(name, container); },
        onCancel: function () { uiState.addingDept = false; draw(container); }
      }));
    }

    orgTree.depts.forEach(function (d, i) {
      list.appendChild(buildDeptRow(d, container, i === orgTree.depts.length - 1));
    });

    card.appendChild(list);
    return card;
  }

  // ---- 合心 / 處室管理員任免 ----------------------------------------------

  function buildPeopleOptions() {
    var people = [];
    var dir = window.VisitMock.DIRECTORY || {};
    var GROUP_LABEL = { volunteer: '志工', staff: '職工', advisor: '幹部/委員' };
    Object.keys(dir).forEach(function (g) {
      (dir[g] || []).forEach(function (p) {
        people.push({ email: p.email, name: p.name, label: p.name + '(' + (GROUP_LABEL[g] || g) + ' · ' + p.orgUnit + ')' });
      });
    });
    (window.VisitMock.MEMBERS || []).forEach(function (m) {
      people.push({ email: m.email, name: m.name, label: m.name + '(成員 · ' + m.team + ')' });
    });
    return people;
  }

  function buildTargetOptions() {
    var targets = [];
    orgTree.hexin.forEach(function (h) {
      targets.push({ key: 'hexin:' + h.id, label: '合心 · ' + h.name, kind: 'hexin', name: h.name });
      (h.heqi || []).forEach(function (q) {
        targets.push({ key: 'heqi:' + h.id + ':' + q.id, label: '和氣 · ' + q.name, kind: 'heqi', name: q.name });
      });
    });
    orgTree.depts.forEach(function (d) {
      targets.push({ key: 'dept:' + d.id, label: '處室 · ' + d.name, kind: 'dept', name: d.name });
    });
    return targets;
  }

  function doAppoint(isAppoint, people, targets) {
    var person = people.filter(function (p) { return p.email === appointState.personEmail; })[0];
    var target = targets.filter(function (t) { return t.key === appointState.targetKey; })[0];
    if (!person || !target) {
      toast('請先選擇人員與單位', 'danger');
      return;
    }
    var fnName = target.kind === 'dept' ? 'set_dept_admin' : 'set_hexin_admin';
    var verb = isAppoint ? '任命' : '解除';
    toast(
      '已示意' + verb + ' ' + person.name + ' 為「' + target.name + '」管理員(' +
        fnName + '(' + (isAppoint ? 'true' : 'false') + ')，未寫回)',
      'success'
    );
  }

  function buildAppointCard(container) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<h2 class="section-title">合心 / 處室管理員任免</h2>' +
      '<p class="section-sub">選一人 + 一個合心 / 和氣 / 處室，示意 set_hexin_admin / set_dept_admin(未寫回)。</p>';

    var grid = document.createElement('div');
    grid.className = 'org-appoint-grid';
    grid.style.marginTop = 'var(--sp-3)';

    var people = buildPeopleOptions();
    var targets = buildTargetOptions();

    var peopleField = document.createElement('div');
    peopleField.className = 'field';
    peopleField.innerHTML = '<label for="org-appoint-person">人員</label>';
    var peopleSelect = document.createElement('select');
    peopleSelect.id = 'org-appoint-person';
    peopleSelect.innerHTML =
      '<option value="">— 選擇人員 —</option>' +
      people.map(function (p) { return '<option value="' + esc(p.email) + '">' + esc(p.label) + '</option>'; }).join('');
    peopleSelect.value = appointState.personEmail;
    peopleSelect.addEventListener('change', function () { appointState.personEmail = peopleSelect.value; });
    peopleField.appendChild(peopleSelect);
    grid.appendChild(peopleField);

    var targetField = document.createElement('div');
    targetField.className = 'field';
    targetField.innerHTML = '<label for="org-appoint-target">合心 / 和氣 / 處室</label>';
    var targetSelect = document.createElement('select');
    targetSelect.id = 'org-appoint-target';
    targetSelect.innerHTML =
      '<option value="">— 選擇單位 —</option>' +
      targets.map(function (t) { return '<option value="' + esc(t.key) + '">' + esc(t.label) + '</option>'; }).join('');
    targetSelect.value = appointState.targetKey;
    targetSelect.addEventListener('change', function () { appointState.targetKey = targetSelect.value; });
    targetField.appendChild(targetSelect);
    grid.appendChild(targetField);

    var appointBtn = document.createElement('button');
    appointBtn.type = 'button';
    appointBtn.className = 'btn btn-primary';
    appointBtn.textContent = '任命';
    appointBtn.addEventListener('click', function () { doAppoint(true, people, targets); });
    grid.appendChild(appointBtn);

    var revokeBtn = document.createElement('button');
    revokeBtn.type = 'button';
    revokeBtn.className = 'btn ghost';
    revokeBtn.textContent = '解除';
    revokeBtn.addEventListener('click', function () { doAppoint(false, people, targets); });
    grid.appendChild(revokeBtn);

    card.appendChild(grid);
    return card;
  }

  // ---- 系統管理員切換(toggle-admin)---------------------------------------

  function buildToggleAdminCard(container) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<h2 class="section-title">系統管理員切換</h2>' +
      '<p class="section-sub">toggle-admin 示意：無法解除自己；系統至少須保留 1 位系統管理員。</p>';

    var trueCount = window.VisitMock.MEMBERS.filter(function (m) { return isAdminState[m.email]; }).length;

    var list = document.createElement('div');
    list.style.marginTop = 'var(--sp-3)';

    window.VisitMock.MEMBERS.forEach(function (m, i) {
      var row = document.createElement('div');
      row.className = 'org-admin-row' + (i === window.VisitMock.MEMBERS.length - 1 ? '' : ' container-line');

      var isSelf = m.email === SELF_EMAIL;
      var isAdmin = !!isAdminState[m.email];
      var isLastAdmin = isAdmin && trueCount <= 1;

      var email = document.createElement('span');
      email.className = 'org-admin-email';
      email.textContent = m.email;
      row.appendChild(email);

      var name = document.createElement('span');
      name.className = 'org-admin-name';
      name.textContent = m.name;
      row.appendChild(name);

      if (isSelf) {
        var youBadge = document.createElement('span');
        youBadge.className = 'badge badge--info';
        youBadge.textContent = '你';
        row.appendChild(youBadge);
      }

      var statusB = document.createElement('span');
      statusB.className = 'badge badge--' + (isAdmin ? 'success' : 'muted');
      statusB.textContent = isAdmin ? '系統管理員' : '一般成員';
      row.appendChild(statusB);

      var actions = document.createElement('div');
      actions.className = 'org-admin-actions';

      var toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'btn ghost';
      toggleBtn.textContent = isAdmin ? '解除系統管理員' : '設為系統管理員';
      var blockSelf = isAdmin && isSelf;
      var blockLast = isAdmin && isLastAdmin;
      toggleBtn.disabled = blockSelf || blockLast;
      toggleBtn.setAttribute('aria-label', (isAdmin ? '解除系統管理員' : '設為系統管理員') + ' · ' + m.name);
      if (blockSelf) toggleBtn.title = '無法解除自己的系統管理員權限';
      else if (blockLast) toggleBtn.title = '系統至少須保留 1 位系統管理員';
      toggleBtn.addEventListener('click', function () {
        if (blockSelf) { toast('無法解除自己的系統管理員權限', 'danger'); return; }
        if (blockLast) { toast('系統至少須保留 1 位系統管理員，無法解除', 'danger'); return; }
        isAdminState[m.email] = !isAdmin;
        toast((isAdmin ? '已解除 ' : '已設為系統管理員 ') + m.name + '(toggle-admin，未寫回)', isAdmin ? 'danger' : 'success');
        draw(container);
      });
      actions.appendChild(toggleBtn);

      row.appendChild(actions);
      list.appendChild(row);
    });

    card.appendChild(list);
    return card;
  }

  // ---- 主繪製 --------------------------------------------------------

  function draw(container) {
    ensureStyles();
    container.innerHTML = '';

    var persona = window.VisitPersona.getPersona();
    var scope = window.VisitPersona.adminScope(persona);

    if (!scope.org) {
      container.appendChild(buildBlockedCard(persona));
      return;
    }

    computeInUse();

    var head = document.createElement('div');
    head.innerHTML =
      '<h2 class="section-title" style="margin-bottom:2px;">組織</h2>' +
      '<p class="hint" style="margin:0 0 var(--sp-4);">合心/和氣樹、處室字典、管理員任免、系統管理員切換 — 以下操作皆為 UI 示意，不會真的寫入後端。</p>';
    container.appendChild(head);

    var stack = document.createElement('div');
    stack.className = 'stack';
    stack.appendChild(buildOrgTreeCard(container));
    stack.appendChild(buildDeptsCard(container));
    stack.appendChild(buildAppointCard(container));
    stack.appendChild(buildToggleAdminCard(container));
    container.appendChild(stack);
  }

  window.VisitProto.registerTab('org', draw);
})();
</script>

</body>
</html>
