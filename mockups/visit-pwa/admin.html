<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>家訪 PWA — 桌面管理後台(原型)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="家訪 PWA 桌面 admin 可點擊原型 — 事件管理 / 成員名冊 / 匯入匯出,依 persona 分層授權。">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<style>
  /* ---- page-local styles (admin.html only; do not touch tokens/components) ---- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; }

  #app {
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: var(--sp-5);
  }

  .admin-page-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-4);
    margin-bottom: var(--sp-4);
  }
  .admin-page-title h1 {
    font-size: var(--fs-h2);
    margin: 0;
  }
  .admin-page-title .persona-hint {
    color: var(--text-dim);
    font-size: 14px;
    font-family: var(--font-mono);
  }

  /* ---- shell: sidebar + main ------------------------------------------ */
  .admin-shell {
    display: flex;
    align-items: flex-start;
    gap: var(--sp-5);
    min-height: 620px;
  }
  .admin-sidebar {
    flex: 0 0 208px;
    width: 208px;
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    padding: var(--sp-3);
    background: var(--surface);
    border-radius: var(--r-lg);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .admin-sidebar .admin-tab {
    width: 100%;
    justify-content: flex-start;
    border: none;
    background: transparent;
    font-family: var(--font-sans);
    font-size: var(--fs-body);
  }
  .admin-tab:disabled,
  .admin-tab[aria-disabled="true"] {
    opacity: 0.38;
    cursor: not-allowed;
    pointer-events: none;
  }
  .admin-tab .tab-note {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .admin-main {
    flex: 1 1 auto;
    min-width: 0;
  }
  .admin-panel {
    outline: none;
  }

  .stack { display: flex; flex-direction: column; gap: var(--sp-5); }
  .stack-sm { display: flex; flex-direction: column; gap: var(--sp-3); }
  .row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }
  .section-title { font-size: var(--fs-h3); margin: 0 0 var(--sp-2); }
  .section-sub { color: var(--text-dim); font-size: 14px; margin: 0; }
  .mono { font-family: var(--font-mono); }
  .hint { color: var(--text-dim); font-size: 14px; }

  /* ---- table ------------------------------------------------------------ */
  .table-scroll { width: 100%; overflow-x: auto; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
  .admin-table th {
    text-align: left;
    padding: var(--sp-2) var(--sp-3);
    color: var(--text-dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    white-space: nowrap;
  }
  .admin-table td {
    padding: var(--sp-2) var(--sp-3);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    vertical-align: middle;
  }
  .admin-table tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }
  .admin-table td.num, .admin-table th.num { font-family: var(--font-mono); text-align: right; }
  .admin-table .btn { height: 28px; padding: 0 var(--sp-3); font-size: 12px; }

  /* ---- event cards -------------------------------------------------------*/
  .event-card { padding: var(--sp-4); cursor: pointer; }
  .event-card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
  .event-card__name { font-weight: 700; font-size: var(--fs-body-lg); }
  .event-card__meta { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2); }
  .event-card__detail {
    margin-top: var(--sp-4);
    padding-top: var(--sp-4);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: none;
  }
  .event-card.is-open .event-card__detail { display: block; }
  .event-card__status-controls { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }
  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--sp-3); margin: var(--sp-3) 0; }
  .kv-grid dt { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
  .kv-grid dd { margin: 0; font-weight: 600; }

  /* ---- forms --------------------------------------------------------------*/
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); }

  /* ---- modal --------------------------------------------------------------*/
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(4, 7, 14, 0.65);
    display: flex; align-items: center; justify-content: center;
    padding: var(--sp-5);
  }
  .modal {
    width: 680px; max-width: 100%; max-height: 82vh;
    overflow-y: auto;
    padding: var(--sp-5);
  }
  .modal__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-4); }
  .modal__close { height: 32px; width: 32px; padding: 0; border-radius: var(--r-sm); }
  .picker-tabs { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-3); }
  .picker-tabs button { height: 32px; padding: 0 var(--sp-3); font-size: 12px; }
  .picker-list { display: flex; flex-direction: column; gap: var(--sp-1); max-height: 280px; overflow-y: auto; }
  .picker-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); }
  .picker-row:hover { background: rgba(255, 255, 255, 0.04); }
  .picker-row label { flex: 1; cursor: pointer; }
  .picker-row .org-unit { color: var(--text-dim); font-size: 12px; }

  /* ---- toast --------------------------------------------------------------*/
  .toast-stack {
    position: fixed; top: var(--sp-5); left: 50%; transform: translateX(-50%);
    z-index: 300; display: flex; flex-direction: column; gap: var(--sp-2);
    align-items: center;
  }
  .toast {
    padding: var(--sp-2) var(--sp-4);
    border-radius: var(--r-md);
    background: var(--surface-raised);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: var(--shadow-md);
    font-size: 14px;
    animation: toast-in var(--dur) var(--ease);
  }
  .toast--success { border-color: rgba(74, 222, 128, 0.4); color: var(--success); }
  .toast--danger { border-color: rgba(255, 107, 107, 0.4); color: var(--danger); }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- no access page -------------------------------------------------- */
  .no-access {
    max-width: 480px;
    margin: var(--sp-8) auto;
    text-align: center;
    padding: var(--sp-6);
  }
  .no-access h2 { margin-top: 0; }

  /* ---- upload zone -------------------------------------------------------*/
  .upload-zone {
    border: 1px dashed rgba(255, 255, 255, 0.24);
    border-radius: var(--r-lg);
    padding: var(--sp-6);
    text-align: center;
    color: var(--text-dim);
  }

  @media (max-width: 900px) {
    .admin-shell { flex-direction: column; }
    .admin-sidebar { flex-direction: row; flex-wrap: wrap; width: 100%; }
  }
</style>
</head>
<body>

<div id="app" data-density="dense"></div>
<div id="persona-mount"></div>
<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

<script src="assets/mock-data.js"></script>
<script src="assets/persona.js"></script>
<script src="assets/prototype.js"></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // 掛載外框 + persona 切換器
  // ------------------------------------------------------------------

  var appEl = document.getElementById('app');

  var titleBar = document.createElement('div');
  titleBar.className = 'admin-page-title';
  titleBar.innerHTML =
    '<h1>家訪 PWA — 管理後台</h1>' +
    '<span class="persona-hint">flood-2026 · 花蓮光復堰塞湖溢流救災</span>';
  appEl.appendChild(titleBar);

  var frameHost = document.createElement('div');
  appEl.appendChild(frameHost);

  var content = VisitProto.mountBrowserFrame(frameHost);

  VisitPersona.mountPersonaSwitcher(document.getElementById('persona-mount'));

  // ------------------------------------------------------------------
  // toast 小工具
  // ------------------------------------------------------------------

  function toast(message, kind) {
    var stack = document.getElementById('toast-stack');
    var t = document.createElement('div');
    t.className = 'toast' + (kind ? ' toast--' + kind : '');
    t.textContent = message;
    stack.appendChild(t);
    setTimeout(function () {
      t.remove();
    }, 3200);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ------------------------------------------------------------------
  // 狀態(僅存於記憶體,重新整理即重置 — 原型用途)
  // ------------------------------------------------------------------

  var state = {
    activeTab: 'events',
    expandedEventId: null,
    memberRevoked: {},     // email -> bool
    pickerOpen: false,
    pickerTab: 'volunteer',
    pickerSearch: '',
    pickerSelected: {},    // email -> bool
    importDryRunShown: false,
    importHashInput: window.VisitMock.IMPORT_DRYRUN.fileHash
  };

  // mock「自己」是名冊中第一位事件管理員,用來示範自己那列不能停權自己。
  var SELF_MEMBER_EMAIL = window.VisitMock.MEMBERS.filter(function (m) {
    return m.isEventAdmin;
  })[0].email;

  // ------------------------------------------------------------------
  // tab 定義
  //   importExport 的 gating 選擇:manageEvents || manageMembers。
  //   spec 只明列 orgAdmin(全擋)/eventAdmin(未提匯入匯出)兩種情境,
  //   這裡取「跟案件資料相關的管理權限」作為交集,讓 eventAdmin/sysAdmin
  //   可用、orgAdmin(僅建事件)不可用 — 屬設計取捨,已於回報中註記。
  // ------------------------------------------------------------------

  var TABS = [
    {
      id: 'events', label: '事件管理', kind: 'built',
      enabled: function (scope) { return scope.manageEvents || scope.createEvent; }
    },
    {
      id: 'members', label: '成員名冊', kind: 'built',
      enabled: function (scope) { return scope.manageMembers; }
    },
    {
      id: 'importExport', label: '匯入匯出', kind: 'built',
      enabled: function (scope) { return scope.manageEvents || scope.manageMembers; }
    },
    {
      id: 'planning', label: '規劃桌', kind: 'placeholder',
      enabled: function (scope) { return scope.planningDesk; }
    },
    {
      id: 'org', label: '組織', kind: 'placeholder',
      enabled: function (scope) { return scope.org; }
    }
  ];

  // ------------------------------------------------------------------
  // 無管理權限擋頁
  // ------------------------------------------------------------------

  function buildNoAccessPage(persona) {
    var wrap = document.createElement('div');
    wrap.className = 'card no-access';
    wrap.innerHTML =
      '<h2>無管理權限</h2>' +
      '<p class="hint">目前身分「' + escapeHtml(persona.label) + '」沒有任何後台管理權限,' +
      '無法檢視事件管理 / 成員名冊 / 匯入匯出 / 規劃桌 / 組織。</p>' +
      '<p class="hint">請使用右下角 persona 切換器切換為 orgAdmin / eventAdmin / sysAdmin 以檢視管理後台。</p>';
    return wrap;
  }

  // ------------------------------------------------------------------
  // 外殼(側邊 tab + 主內容)
  // ------------------------------------------------------------------

  function buildShell(scope) {
    var shell = document.createElement('div');
    shell.className = 'admin-shell';

    var sidebar = document.createElement('div');
    sidebar.className = 'admin-sidebar';
    sidebar.setAttribute('role', 'tablist');
    sidebar.setAttribute('aria-orientation', 'vertical');

    TABS.forEach(function (tab) {
      var isEnabled = tab.enabled(scope);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'admin-tab';
      btn.id = 'tabbtn-' + tab.id;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-controls', 'tabpanel-' + tab.id);
      btn.setAttribute('aria-selected', tab.id === state.activeTab ? 'true' : 'false');
      btn.textContent = tab.label;

      if (!isEnabled) {
        btn.disabled = true;
        btn.setAttribute('aria-disabled', 'true');
        var note = document.createElement('span');
        note.className = 'tab-note';
        note.textContent = '無權限';
        btn.appendChild(note);
      } else if (tab.id === state.activeTab) {
        btn.classList.add('active');
      }

      btn.addEventListener('click', function () {
        state.activeTab = tab.id;
        render();
      });

      sidebar.appendChild(btn);
    });

    var main = document.createElement('div');
    main.className = 'admin-main';

    var panel = document.createElement('div');
    panel.className = 'admin-panel';
    panel.id = 'tabpanel-' + state.activeTab;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('tabindex', '0');
    panel.setAttribute('aria-labelledby', 'tabbtn-' + state.activeTab);
    main.appendChild(panel);

    shell.appendChild(sidebar);
    shell.appendChild(main);

    return { shell: shell, panel: panel };
  }

  function placeholderCard(name, label) {
    var wrap = document.createElement('div');
    wrap.className = 'card';
    wrap.innerHTML =
      '<h2 class="section-title">' + escapeHtml(label) + '</h2>' +
      '<p class="hint">此區由「' + escapeHtml(label) + '」模組提供。</p>' +
      '<p class="hint">尚未偵測到 <code class="mono">VisitProto.registerTab(\'' + name +
      '\', fn)</code> 的註冊 — 後續模組註冊完成後,點此 tab 會自動改為呼叫該模組。</p>';
    return wrap;
  }

  // ------------------------------------------------------------------
  // 事件管理 tab
  // ------------------------------------------------------------------

  var STATUS_TRANSITIONS = { active: ['closing'], closing: ['closed', 'active'], closed: [] };
  var STATUS_ORDER = ['active', 'closing', 'closed'];
  var STATUS_BADGE = { active: 'success', closing: 'warning', closed: 'muted' };

  function renderEventsTab(panel, scope, persona) {
    panel.innerHTML = '';
    var stack = document.createElement('div');
    stack.className = 'stack';

    if (scope.createEvent) {
      stack.appendChild(buildCreateEventForm(scope));
    }

    if (scope.manageEvents) {
      var events = window.VisitMock.EVENTS.slice();
      var scopedSlugs = persona.adminSignal && persona.adminSignal.eventAdminSlugs;
      if (scopedSlugs && scopedSlugs.length && !persona.adminSignal.isAdmin) {
        events = events.filter(function (e) { return scopedSlugs.indexOf(e.slug) !== -1; });
      }
      stack.appendChild(buildEventsList(events, persona));
    } else if (scope.createEvent) {
      var note = document.createElement('p');
      note.className = 'hint';
      note.textContent = '你僅有「建立事件」權限,無法檢視或管理現有事件列表。';
      stack.appendChild(note);
    }

    panel.appendChild(stack);
  }

  function buildCreateEventForm(scope) {
    var card = document.createElement('div');
    card.className = 'card';

    var hexinOptions = (window.VisitMock.ORG_TREE.hexin || []).map(function (h) {
      return '<option value="' + h.id + '">' + escapeHtml(h.name) + '</option>';
    }).join('');

    card.innerHTML =
      '<h2 class="section-title">建立事件</h2>' +
      '<p class="section-sub">示意表單 — 提交不會實際呼叫後端。</p>' +
      '<form class="form-grid" id="create-event-form" style="margin-top: var(--sp-4);">' +
      '  <div class="field"><label for="ce-name">事件名稱</label><input id="ce-name" type="text" placeholder="例:光復溢流救災(第三階段)" required></div>' +
      '  <div class="field"><label for="ce-slug">Slug</label><input id="ce-slug" type="text" placeholder="flood-2026-c" required></div>' +
      '  <div class="field"><label for="ce-county">縣市</label><input id="ce-county" type="text" placeholder="花蓮縣" required></div>' +
      '  <div class="field"><label for="ce-owner">Owner 合心</label><select id="ce-owner">' + hexinOptions + '</select></div>' +
      '</form>' +
      '<div class="row" style="margin-top: var(--sp-4);"><button type="submit" form="create-event-form" class="btn btn-primary">建立(示意)</button></div>';

    var form = card.querySelector('#create-event-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = card.querySelector('#ce-name').value.trim();
      var slug = card.querySelector('#ce-slug').value.trim();
      var county = card.querySelector('#ce-county').value.trim();
      if (!name || !slug || !county) {
        toast('請填寫事件名稱 / slug / 縣市', 'danger');
        return;
      }
      window.VisitMock.EVENTS.unshift({
        id: 'evt-' + slug,
        slug: slug,
        name: name,
        status: 'active',
        openSupport: false,
        county: county,
        driveConfigured: false
      });
      toast('已示意建立事件「' + name + '」(未真的呼叫後端)', 'success');
      form.reset();
      render();
    });

    return card;
  }

  function buildEventsList(events, persona) {
    var wrap = document.createElement('div');
    wrap.className = 'stack-sm';

    var heading = document.createElement('h2');
    heading.className = 'section-title';
    heading.textContent = '事件清單(' + events.length + ')';
    wrap.appendChild(heading);

    if (events.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'hint';
      empty.textContent = '你目前沒有可管理的事件。';
      wrap.appendChild(empty);
      return wrap;
    }

    events.forEach(function (evt) {
      wrap.appendChild(buildEventCard(evt, persona));
    });

    return wrap;
  }

  function buildEventCard(evt, persona) {
    var card = document.createElement('div');
    card.className = 'card event-card';
    if (state.expandedEventId === evt.id) card.classList.add('is-open');

    var head = document.createElement('div');
    head.className = 'event-card__head';
    head.innerHTML =
      '<div><div class="event-card__name">' + escapeHtml(evt.name) + '</div>' +
      '<div class="hint mono">' + escapeHtml(evt.slug) + '</div></div>' +
      '<span class="badge badge--' + STATUS_BADGE[evt.status] + '">' + escapeHtml(evt.status) + '</span>';
    card.appendChild(head);

    var meta = document.createElement('div');
    meta.className = 'event-card__meta';
    meta.innerHTML =
      '<span class="badge">' + escapeHtml(evt.county) + '</span>' +
      '<span class="badge badge--' + (evt.openSupport ? 'info' : 'muted') + '">openSupport: ' + (evt.openSupport ? '開放' : '關閉') + '</span>' +
      '<span class="badge badge--' + (evt.driveConfigured ? 'success' : 'warning') + '">driveConfigured: ' + (evt.driveConfigured ? '已設定' : '未設定') + '</span>';
    card.appendChild(meta);

    var detail = document.createElement('div');
    detail.className = 'event-card__detail';

    var config = window.VisitMock.EVENT_CONFIG[evt.slug];
    if (config) {
      var kv = document.createElement('dl');
      kv.className = 'kv-grid';
      kv.innerHTML =
        '<div><dt>啟用欄位數</dt><dd class="mono">' + config.enabledFields.length + '</dd></div>' +
        '<div><dt>路線</dt><dd>' + config.routes.map(function (r) { return r.id; }).join(', ') + '</dd></div>' +
        '<div><dt>隊伍</dt><dd>' + config.teams.map(function (t) { return t.label; }).join('、') + '</dd></div>' +
        '<div><dt>鄉鎮市區</dt><dd>' + config.districts.join('、') + '</dd></div>' +
        '<div><dt>縣市</dt><dd>' + escapeHtml(config.county) + '</dd></div>';
      detail.appendChild(kv);
    } else {
      var noCfg = document.createElement('p');
      noCfg.className = 'hint';
      noCfg.textContent = '此事件無詳細欄位設定(mock 資料未提供 EVENT_CONFIG)。';
      detail.appendChild(noCfg);
    }

    if (persona.adminSignal && persona.adminSignal.isAdmin) {
      var statusWrap = document.createElement('div');
      statusWrap.innerHTML = '<div class="hint" style="margin-top: var(--sp-2);">狀態切換(僅系統管理員)</div>';
      var controls = document.createElement('div');
      controls.className = 'event-card__status-controls';
      var allowed = STATUS_TRANSITIONS[evt.status] || [];

      STATUS_ORDER.forEach(function (target) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn ghost';
        var canGo = allowed.indexOf(target) !== -1;
        btn.disabled = !canGo;
        btn.textContent = '設為 ' + target;
        btn.setAttribute('aria-label', evt.name + ' 設為 ' + target + (canGo ? '' : '(不允許此轉換)'));
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          evt.status = target;
          toast('「' + evt.name + '」狀態已切換為 ' + target, 'success');
          render();
        });
        controls.appendChild(btn);
      });

      statusWrap.appendChild(controls);
      detail.appendChild(statusWrap);
    }

    card.appendChild(detail);

    head.addEventListener('click', function () {
      state.expandedEventId = state.expandedEventId === evt.id ? null : evt.id;
      render();
    });

    return card;
  }

  // ------------------------------------------------------------------
  // 成員名冊 tab
  // ------------------------------------------------------------------

  function renderMembersTab(panel, scope) {
    panel.innerHTML = '';
    var stack = document.createElement('div');
    stack.className = 'stack';

    var headRow = document.createElement('div');
    headRow.className = 'row-between';
    headRow.innerHTML = '<h2 class="section-title">成員名冊(' + window.VisitMock.MEMBERS.length + ')</h2>';
    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn btn-primary';
    addBtn.textContent = '批次新增';
    addBtn.addEventListener('click', function () {
      state.pickerOpen = true;
      state.pickerTab = 'volunteer';
      state.pickerSearch = '';
      state.pickerSelected = {};
      render();
    });
    headRow.appendChild(addBtn);
    stack.appendChild(headRow);

    var tableScroll = document.createElement('div');
    tableScroll.className = 'table-scroll';
    var table = document.createElement('table');
    table.className = 'admin-table';
    table.innerHTML =
      '<thead><tr>' +
      '<th>Email</th><th>姓名</th><th>隊伍</th><th>可用路線</th><th>角色</th><th>事件管理員</th><th>狀態</th><th></th>' +
      '</tr></thead>';
    var tbody = document.createElement('tbody');

    window.VisitMock.MEMBERS.forEach(function (m) {
      var revoked = !!state.memberRevoked[m.email];
      var isSelf = m.email === SELF_MEMBER_EMAIL;

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="mono">' + escapeHtml(m.email) + (isSelf ? ' <span class="badge badge--info">你</span>' : '') + '</td>' +
        '<td>' + escapeHtml(m.name) + '</td>' +
        '<td>' + escapeHtml(m.team) + '</td>' +
        '<td class="mono">' + m.availableRoutes.join(',') + '</td>' +
        '<td>' + escapeHtml(m.role) + '</td>' +
        '<td>' + (m.isEventAdmin ? '<span class="badge badge--success">是</span>' : '<span class="badge badge--muted">否</span>') + '</td>' +
        '<td>' + (revoked ? '<span class="badge badge--danger">已停權</span>' : '<span class="badge badge--success">正常</span>') + '</td>';

      var actionTd = document.createElement('td');
      var actionBtn = document.createElement('button');
      actionBtn.type = 'button';
      actionBtn.className = 'btn ghost';
      actionBtn.textContent = revoked ? '復權' : '停權';
      actionBtn.disabled = isSelf;
      if (isSelf) actionBtn.title = '無法對自己執行此操作';
      actionBtn.addEventListener('click', function () {
        state.memberRevoked[m.email] = !revoked;
        toast((revoked ? '已復權 ' : '已停權 ') + m.name, revoked ? 'success' : 'danger');
        render();
      });
      actionTd.appendChild(actionBtn);
      tr.appendChild(actionTd);

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    tableScroll.appendChild(table);
    stack.appendChild(tableScroll);
    panel.appendChild(stack);

    if (state.pickerOpen) {
      panel.appendChild(buildPickerModal());
    }
  }

  function buildPickerModal() {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closePicker();
    });

    var modal = document.createElement('div');
    modal.className = 'card glass modal';

    var head = document.createElement('div');
    head.className = 'modal__head';
    head.innerHTML = '<h2 class="section-title" style="margin:0;">挑人器 — 批次新增</h2>';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn ghost modal__close';
    closeBtn.setAttribute('aria-label', '關閉');
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', closePicker);
    head.appendChild(closeBtn);
    modal.appendChild(head);

    var note = document.createElement('p');
    note.className = 'hint';
    note.textContent = '單批最多 50 筆。清單為靜態示意資料,可用姓名 / email / 單位搜尋。';
    modal.appendChild(note);

    var tabsWrap = document.createElement('div');
    tabsWrap.className = 'picker-tabs';
    var DIR_LABELS = { volunteer: '志工', staff: '職工', advisor: '幹部/委員' };
    Object.keys(DIR_LABELS).forEach(function (key) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ghost';
      if (state.pickerTab === key) btn.classList.add('is-active');
      btn.style.background = state.pickerTab === key ? 'var(--surface-raised)' : '';
      btn.style.color = state.pickerTab === key ? 'var(--accent)' : '';
      btn.textContent = DIR_LABELS[key] + ' (' + window.VisitMock.DIRECTORY[key].length + ')';
      btn.addEventListener('click', function () {
        state.pickerTab = key;
        render();
      });
      tabsWrap.appendChild(btn);
    });
    modal.appendChild(tabsWrap);

    var searchField = document.createElement('div');
    searchField.className = 'field';
    searchField.innerHTML = '<label for="picker-search">搜尋</label>';
    var searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.id = 'picker-search';
    searchInput.placeholder = '姓名 / email / 單位';
    searchInput.value = state.pickerSearch;
    searchInput.addEventListener('input', function () {
      state.pickerSearch = searchInput.value;
      renderPickerList();
    });
    searchField.appendChild(searchInput);
    modal.appendChild(searchField);

    var list = document.createElement('div');
    list.className = 'picker-list';
    list.id = 'picker-list';
    modal.appendChild(list);

    var footer = document.createElement('div');
    footer.className = 'row-between';
    footer.style.marginTop = 'var(--sp-4)';
    var countLabel = document.createElement('span');
    countLabel.className = 'hint';
    countLabel.id = 'picker-count';
    footer.appendChild(countLabel);
    var addSelectedBtn = document.createElement('button');
    addSelectedBtn.type = 'button';
    addSelectedBtn.className = 'btn btn-primary';
    addSelectedBtn.textContent = '加入所選(示意)';
    addSelectedBtn.addEventListener('click', function () {
      var n = Object.keys(state.pickerSelected).filter(function (k) { return state.pickerSelected[k]; }).length;
      if (n === 0) {
        toast('請至少選擇一人', 'danger');
        return;
      }
      toast('已示意加入 ' + n + ' 人(未真的呼叫後端)', 'success');
      closePicker();
    });
    footer.appendChild(addSelectedBtn);
    modal.appendChild(footer);

    overlay.appendChild(modal);

    function renderPickerList() {
      var listEl = modal.querySelector('#picker-list');
      var countEl = modal.querySelector('#picker-count');
      listEl.innerHTML = '';
      var people = window.VisitMock.DIRECTORY[state.pickerTab] || [];
      var q = state.pickerSearch.trim().toLowerCase();
      var filtered = people.filter(function (p) {
        if (!q) return true;
        return (p.name + p.email + p.orgUnit).toLowerCase().indexOf(q) !== -1;
      });

      if (filtered.length === 0) {
        var empty = document.createElement('p');
        empty.className = 'hint';
        empty.textContent = '沒有符合搜尋條件的人員。';
        listEl.appendChild(empty);
      }

      filtered.forEach(function (p) {
        var row = document.createElement('div');
        row.className = 'picker-row';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = 'pk-' + p.email;
        cb.checked = !!state.pickerSelected[p.email];
        cb.addEventListener('change', function () {
          state.pickerSelected[p.email] = cb.checked;
          updateCount();
        });
        var label = document.createElement('label');
        label.setAttribute('for', 'pk-' + p.email);
        label.innerHTML = escapeHtml(p.name) + ' <span class="mono hint">' + escapeHtml(p.email) + '</span>';
        var unit = document.createElement('span');
        unit.className = 'org-unit';
        unit.textContent = p.orgUnit;
        row.appendChild(cb);
        row.appendChild(label);
        row.appendChild(unit);
        listEl.appendChild(row);
      });

      updateCount();

      function updateCount() {
        var n = Object.keys(state.pickerSelected).filter(function (k) { return state.pickerSelected[k]; }).length;
        countEl.textContent = '已選 ' + n + ' 人(單批最多 50 筆)';
      }
    }

    // deferred so elements exist in DOM
    setTimeout(renderPickerList, 0);

    document.addEventListener('keydown', escHandler);
    function escHandler(e) {
      if (e.key === 'Escape') closePicker();
    }
    function closePicker() {
      document.removeEventListener('keydown', escHandler);
      state.pickerOpen = false;
      render();
    }

    return overlay;
  }

  // ------------------------------------------------------------------
  // 匯入匯出 tab
  // ------------------------------------------------------------------

  function renderImportExportTab(panel, scope, persona) {
    panel.innerHTML = '';
    var stack = document.createElement('div');
    stack.className = 'stack';

    // 上傳區
    var uploadCard = document.createElement('div');
    uploadCard.className = 'card';
    uploadCard.innerHTML =
      '<h2 class="section-title">匯入</h2>' +
      '<div class="upload-zone">' +
      '  <p>拖放 CSV 檔案到這裡,或點擊選擇檔案(示意 — 不會真的讀取檔案)</p>' +
      '</div>' +
      '<div class="row" style="margin-top: var(--sp-4);">' +
      '  <button type="button" class="btn btn-primary" id="ie-run-dryrun">使用範例檔進行 Dry-run</button>' +
      '  <button type="button" class="btn ghost" id="ie-download-template">下載 CSV 範本</button>' +
      '</div>';
    stack.appendChild(uploadCard);

    uploadCard.querySelector('#ie-run-dryrun').addEventListener('click', function () {
      state.importDryRunShown = true;
      render();
    });
    uploadCard.querySelector('#ie-download-template').addEventListener('click', function () {
      downloadCsvTemplate();
      toast('已下載 CSV 範本', 'success');
    });

    if (state.importDryRunShown) {
      stack.appendChild(buildDryRunPreview());
    }

    // 匯出區
    var exportCard = document.createElement('div');
    exportCard.className = 'card';
    var canSeePII = window.VisitPersona.canSeePII(persona) && persona.bypass;
    exportCard.innerHTML =
      '<h2 class="section-title">匯出</h2>' +
      '<p class="hint">PII 欄(身分證字號 / 受款人身分證字號 / 內部備註)僅 bypass 權限者可見;' +
      '目前身分「' + escapeHtml(persona.label) + '」' + (canSeePII ? '可見 PII 欄。' : '匯出將自動遮蔽 PII 欄。') + '</p>' +
      '<div class="row" style="margin-top: var(--sp-3);"><button type="button" class="btn ghost" id="ie-export-all">匯出全部(CSV)</button></div>';
    exportCard.querySelector('#ie-export-all').addEventListener('click', function () {
      exportAllCsv(persona);
      toast('已匯出全部案件資料', 'success');
    });
    stack.appendChild(exportCard);

    panel.appendChild(stack);
  }

  function buildDryRunPreview() {
    var card = document.createElement('div');
    card.className = 'card';
    var dryRun = window.VisitMock.IMPORT_DRYRUN;

    var ACTION_BADGE = { insert: 'success', update: 'info', error: 'danger' };
    var ACTION_LABEL = { insert: '新增', update: '更新', error: '錯誤' };

    var rowsHtml = dryRun.rows.map(function (row) {
      var summary = Object.keys(row.data).map(function (k) {
        return k + '=' + row.data[k];
      }).join(', ');
      return '<tr>' +
        '<td><span class="badge badge--' + ACTION_BADGE[row.action] + '">' + ACTION_LABEL[row.action] + '</span></td>' +
        '<td class="mono" style="max-width:520px; white-space:normal;">' + escapeHtml(summary) + '</td>' +
        '<td>' + (row.error ? '<span class="badge badge--danger">' + escapeHtml(row.error) + '</span>' : '—') + '</td>' +
        '</tr>';
    }).join('');

    var insertCount = dryRun.rows.filter(function (r) { return r.action === 'insert'; }).length;
    var updateCount = dryRun.rows.filter(function (r) { return r.action === 'update'; }).length;
    var errorCount = dryRun.rows.filter(function (r) { return r.action === 'error'; }).length;

    card.innerHTML =
      '<h2 class="section-title">Dry-run 預覽</h2>' +
      '<p class="hint">fileHash: <span class="mono">' + escapeHtml(dryRun.fileHash) + '</span> · ' +
      '新增 ' + insertCount + ' / 更新 ' + updateCount + ' / 錯誤 ' + errorCount + '</p>' +
      '<div class="table-scroll"><table class="admin-table">' +
      '<thead><tr><th>動作</th><th>資料摘要</th><th>錯誤訊息</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table></div>' +
      '<div class="field" style="max-width:260px; margin-top: var(--sp-4);">' +
      '  <label for="ie-hash-confirm">確認 fileHash(提交前比對)</label>' +
      '  <input type="text" id="ie-hash-confirm" class="mono" value="' + escapeHtml(state.importHashInput) + '">' +
      '</div>' +
      '<div class="row" style="margin-top: var(--sp-3);">' +
      '  <button type="button" class="btn btn-primary" id="ie-commit">提交(commit)</button>' +
      '  <span class="hint">提交時 fileHash 需與 dry-run 一致,否則回傳 409(檔案已變更,需重新 dry-run)。</span>' +
      '</div>';

    var hashInput = card.querySelector('#ie-hash-confirm');
    hashInput.addEventListener('input', function () {
      state.importHashInput = hashInput.value;
    });

    card.querySelector('#ie-commit').addEventListener('click', function () {
      if (state.importHashInput === dryRun.fileHash) {
        toast('提交成功(示意):新增 ' + insertCount + '、更新 ' + updateCount + ' 筆', 'success');
      } else {
        toast('409 Conflict — fileHash 與 dry-run 不一致,請重新執行 dry-run', 'danger');
      }
    });

    return card;
  }

  function downloadCsvTemplate() {
    var headers = window.VisitMock.FIELD_CATALOG.map(function (f) { return f.key; });
    var csv = headers.join(',') + '\n';
    triggerDownload(csv, 'visit-pwa-template.csv');
  }

  function exportAllCsv(persona) {
    var canSeePII = window.VisitPersona.canSeePII(persona) && persona.bypass;
    var fields = window.VisitMock.FIELD_CATALOG.filter(function (f) {
      return canSeePII || !f.pii;
    });
    var headers = fields.map(function (f) { return f.key; });
    var lines = [headers.join(',')];
    window.VisitMock.CASES.forEach(function (c) {
      var row = fields.map(function (f) {
        var v = c[f.key];
        if (v == null) return '';
        var s = String(v).replace(/"/g, '""');
        return /[,"\n]/.test(s) ? '"' + s + '"' : s;
      });
      lines.push(row.join(','));
    });
    triggerDownload(lines.join('\n'), 'visit-pwa-export.csv');
  }

  function triggerDownload(text, filename) {
    var blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // ------------------------------------------------------------------
  // 主 render
  // ------------------------------------------------------------------

  function render() {
    var persona = window.VisitPersona.getPersona();
    var scope = window.VisitPersona.adminScope(persona);
    var anyAccess = scope.manageEvents || scope.createEvent || scope.manageMembers || scope.planningDesk || scope.org;

    content.innerHTML = '';

    if (!anyAccess) {
      content.appendChild(buildNoAccessPage(persona));
      return;
    }

    var activeDef = TABS.filter(function (t) { return t.id === state.activeTab; })[0];
    if (!activeDef || !activeDef.enabled(scope)) {
      var firstEnabled = TABS.filter(function (t) { return t.enabled(scope); })[0];
      state.activeTab = firstEnabled ? firstEnabled.id : TABS[0].id;
    }

    var built = buildShell(scope);
    content.appendChild(built.shell);

    switch (state.activeTab) {
      case 'events':
        renderEventsTab(built.panel, scope, persona);
        break;
      case 'members':
        renderMembersTab(built.panel, scope);
        break;
      case 'importExport':
        renderImportExportTab(built.panel, scope, persona);
        break;
      case 'planning':
        renderPlaceholder(built.panel, 'planning', '規劃桌');
        break;
      case 'org':
        renderPlaceholder(built.panel, 'org', '組織');
        break;
      default:
        break;
    }
  }

  function renderPlaceholder(panel, name, label) {
    panel.innerHTML = '';
    var fn = window.VisitProto.getTab(name);
    if (typeof fn === 'function') {
      fn(panel);
    } else {
      panel.appendChild(placeholderCard(name, label));
    }
  }

  window.VisitPersona.onPersonaChange(render);
  render();
})();
</script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // 規劃桌(路線規劃)tab — 掛載到 VisitProto.registerTab('planning', fn)
  //
  // 純前端示意:三欄工作區(區域階層樹 / 門牌點地圖 / 指派面板)。
  // 所有「套用 / 授權 / 建案 / 手動釘選」皆只做 UI 回饋(toast),不寫入
  // 任何 window.VisitMock 資料,避免與事件管理 / 成員名冊等其他 tab 的
  // mock 狀態互相污染。
  // ------------------------------------------------------------------

  if (!window.VisitMock || !window.VisitProto) return;

  var EVENT_SLUG = 'flood-2026';
  var EVENT_CFG = window.VisitMock.EVENT_CONFIG[EVENT_SLUG] || {};
  var BASE_ROUTES = EVENT_CFG.routes || [];
  var ALL_POINTS = window.VisitMock.ADDR_POINTS || [];
  var ADDR_REGIONS = (window.VisitMock.ADDR_REGIONS && window.VisitMock.ADDR_REGIONS['花蓮縣']) || {};
  var MEMBERS = window.VisitMock.MEMBERS || [];

  var TEAM_LABELS = {};
  (EVENT_CFG.teams || []).forEach(function (t) { TEAM_LABELS[t.id] = t.label; });

  // ---- 地圖座標正規化(固定參考框,篩選時標記不跳動)-------------------

  var lats = ALL_POINTS.map(function (p) { return p.lat; });
  var lngs = ALL_POINTS.map(function (p) { return p.lng; });
  var minLat = lats.length ? Math.min.apply(null, lats) : 0;
  var maxLat = lats.length ? Math.max.apply(null, lats) : 1;
  var minLng = lngs.length ? Math.min.apply(null, lngs) : 0;
  var maxLng = lngs.length ? Math.max.apply(null, lngs) : 1;
  var latRange = (maxLat - minLat) || 1;
  var lngRange = (maxLng - minLng) || 1;

  function pointPct(p) {
    return {
      x: ((p.lng - minLng) / lngRange) * 84 + 8,
      y: (1 - (p.lat - minLat) / latRange) * 76 + 10
    };
  }

  // ---- 狀態(存於記憶體,跨此 tab 的重新繪製而保留;整頁重新整理即重置)---

  var pdState = {
    expanded: {},             // path -> bool,樹節點展開狀態
    selectedNeighborhood: null, // { district, village, neighborhood } | null
    selection: {},            // addrKey -> true
    chosenRouteId: null,      // 批次改路線目前選取的路線
    extraRoutes: [],          // 本次 session 新增的路線 [{id,label,color}]
    memberGrants: {},         // email -> { routeId: bool }
    memberGrantsInit: false
  };

  // 預設展開 光復鄉 › 大平村,因 mock ADDR_POINTS 僅涵蓋此村里。
  if (ADDR_REGIONS['光復鄉']) {
    pdState.expanded['光復鄉'] = true;
    pdState.expanded['光復鄉/大平村'] = true;
  }

  // ---- 小工具 ----------------------------------------------------------

  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function toArray(list) {
    return Array.prototype.slice.call(list);
  }

  function toast(message, kind) {
    var stack = document.getElementById('toast-stack');
    if (!stack) return;
    var t = document.createElement('div');
    t.className = 'toast' + (kind ? ' toast--' + kind : '');
    t.textContent = message;
    stack.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function getAllRoutes() {
    return BASE_ROUTES.concat(pdState.extraRoutes);
  }

  // route-e(第 5 條)沿用預先定義好的 token;第 6 條起依 tokens.css 註解的
  // 循環規則計算新 hue:hsl(210 + (index-5)*47, 75%, 60%)。
  function nextRouteMeta(index) {
    var letter = String.fromCharCode(64 + index);
    if (index <= 5) {
      return { id: letter, color: 'var(--route-' + letter.toLowerCase() + ')' };
    }
    var hue = (210 + (index - 5) * 47) % 360;
    return { id: letter, color: 'hsl(' + hue + ' 75% 60%)' };
  }

  function ensureMemberGrants() {
    if (pdState.memberGrantsInit) return;
    MEMBERS.forEach(function (m) {
      var g = {};
      (m.availableRoutes || []).forEach(function (r) { g[r] = true; });
      pdState.memberGrants[m.email] = g;
    });
    pdState.memberGrantsInit = true;
  }

  // ---- 一次性樣式注入(scoped，pd- 前綴，不動 tokens.css / components.css)---

  function ensureStyles() {
    if (document.getElementById('pd-planning-styles')) return;
    var style = document.createElement('style');
    style.id = 'pd-planning-styles';
    style.textContent =
      '.pd-workspace{display:flex;gap:var(--sp-4);height:640px;min-width:0;}' +
      '.pd-col{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface);border-radius:var(--r-lg);border:1px solid rgba(255,255,255,0.08);}' +
      '.pd-col-left{flex:0 0 320px;width:320px;}' +
      '.pd-col-center{flex:1 1 auto;}' +
      '.pd-col-right{flex:0 0 360px;width:360px;}' +
      '.pd-col-head{flex:0 0 auto;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid rgba(255,255,255,0.08);}' +
      '.pd-col-head h2{margin:0;font-size:var(--fs-h3);}' +
      '.pd-col-head p{margin:4px 0 0;}' +
      '.pd-col-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--sp-3);}' +
      '.pd-col-right .pd-col-body{display:flex;flex-direction:column;gap:var(--sp-3);padding-bottom:400px;}' +
      '.pd-tree-node{min-width:0;}' +
      '.pd-tree-btn{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:6px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-family:inherit;}' +
      '.pd-tree-btn:hover{background:rgba(255,255,255,0.06);}' +
      '.pd-tree-btn.is-active{background:var(--accent);color:#06070B;font-weight:700;}' +
      '.pd-caret{display:inline-block;width:12px;flex:0 0 auto;color:var(--text-dim);font-size:10px;}' +
      '.pd-depth-1 .pd-tree-btn{padding-left:22px;}' +
      '.pd-depth-2 .pd-tree-btn{padding-left:36px;font-size:12px;}' +
      '.pd-map{position:relative;height:240px;border-radius:var(--r-md);overflow:hidden;cursor:crosshair;user-select:none;flex:0 0 auto;margin-bottom:var(--sp-3);background-color:var(--bg);background-image:radial-gradient(circle at 26% 20%, rgba(76,154,255,0.22), transparent 55%),radial-gradient(circle at 78% 74%, rgba(74,222,128,0.14), transparent 50%),repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 26px),repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 26px);}' +
      '.pd-point{position:absolute;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:var(--muted);border:2px solid rgba(6,7,11,0.65);padding:0;cursor:pointer;}' +
      '.pd-point:hover{filter:brightness(1.3);}' +

      '.pd-list-row{display:flex;align-items:center;gap:var(--sp-2);padding:4px 6px;border-radius:var(--r-sm);font-size:12px;min-width:0;}' +
      '.pd-list-row:hover{background:rgba(255,255,255,0.04);}' +
      '.pd-list-row label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}' +

      '.pd-card{padding:var(--sp-4);border-radius:var(--r-md);background:var(--surface-raised);}' +
      '.pd-card h3{margin:0 0 6px;font-size:15px;}' +
      '.pd-card .hint{margin:0 0 var(--sp-2);}' +
      '.pd-route-pick{display:flex;flex-wrap:wrap;gap:6px;margin:var(--sp-2) 0;}' +
      '.pd-route-pick button{border:2px solid transparent;cursor:pointer;font:inherit;}' +

      '.pd-member-row{display:flex;flex-direction:column;gap:4px;padding:var(--sp-2) 0;border-bottom:1px solid rgba(255,255,255,0.06);}' +
      '.pd-member-row:last-child{border-bottom:none;}' +
      '.pd-member-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);font-size:13px;}' +
      '.pd-member-routes{display:flex;flex-wrap:wrap;gap:6px;}' +
      '.pd-member-routes label{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text-dim);cursor:pointer;}' +
      '.pd-member-routes .route-chip{font-size:10px;padding:1px 6px;}' +
      '.pd-newroute-row{display:flex;gap:var(--sp-2);align-items:flex-end;}' +
      '.pd-newroute-row .field{flex:1 1 auto;min-width:0;margin:0;}' +
      '@media (max-width: 1180px){.pd-workspace{flex-wrap:wrap;height:auto;}.pd-col-left,.pd-col-right{width:100%;flex:1 1 100%;}.pd-col-center{flex:1 1 100%;}}';
    document.head.appendChild(style);
  }

  // ---- 左欄:區域階層樹 --------------------------------------------------

  function buildTreeHtml() {
    var html = '';
    Object.keys(ADDR_REGIONS).forEach(function (district) {
      var distExpanded = !!pdState.expanded[district];
      html += '<div class="pd-tree-node">' +
        '<button type="button" class="pd-tree-btn" data-kind="toggle" data-path="' + esc(district) + '" aria-expanded="' + distExpanded + '">' +
        '<span class="pd-caret">' + (distExpanded ? '▾' : '▸') + '</span>' + esc(district) + '</button></div>';
      if (!distExpanded) return;
      var villages = ADDR_REGIONS[district];
      Object.keys(villages).forEach(function (village) {
        var vPath = district + '/' + village;
        var vExpanded = !!pdState.expanded[vPath];
        html += '<div class="pd-tree-node pd-depth-1">' +
          '<button type="button" class="pd-tree-btn" data-kind="toggle" data-path="' + esc(vPath) + '" aria-expanded="' + vExpanded + '">' +
          '<span class="pd-caret">' + (vExpanded ? '▾' : '▸') + '</span>' + esc(village) + '</button></div>';
        if (!vExpanded) return;
        (villages[village] || []).forEach(function (nb) {
          var sel = pdState.selectedNeighborhood;
          var isSel = !!(sel && sel.district === district && sel.village === village && sel.neighborhood === nb);
          html += '<div class="pd-tree-node pd-depth-2">' +
            '<button type="button" class="pd-tree-btn' + (isSel ? ' is-active' : '') + '" data-kind="leaf" ' +
            'data-district="' + esc(district) + '" data-village="' + esc(village) + '" data-neighborhood="' + esc(nb) + '" ' +
            'aria-pressed="' + isSel + '">' + esc(nb) + '</button></div>';
        });
      });
    });
    return html || '<p class="hint">無區域資料。</p>';
  }

  function buildLeftCol(container) {
    var col = document.createElement('div');
    col.className = 'pd-col pd-col-left';

    var head = document.createElement('div');
    head.className = 'pd-col-head';
    head.innerHTML = '<h2>區域階層樹</h2><p class="hint">行政區 › 村里 › 鄰。點選「鄰」篩選中欄門牌點。</p>';
    col.appendChild(head);

    var body = document.createElement('div');
    body.className = 'pd-col-body';
    body.setAttribute('role', 'tree');
    body.innerHTML = buildTreeHtml();
    col.appendChild(body);

    toArray(body.querySelectorAll('[data-kind="toggle"]')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var path = btn.getAttribute('data-path');
        pdState.expanded[path] = !pdState.expanded[path];
        draw(container);
      });
    });
    toArray(body.querySelectorAll('[data-kind="leaf"]')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var d = btn.getAttribute('data-district');
        var v = btn.getAttribute('data-village');
        var nb = btn.getAttribute('data-neighborhood');
        var cur = pdState.selectedNeighborhood;
        if (cur && cur.district === d && cur.village === v && cur.neighborhood === nb) {
          pdState.selectedNeighborhood = null;
        } else {
          pdState.selectedNeighborhood = { district: d, village: v, neighborhood: nb };
        }
        draw(container);
      });
    });

    return col;
  }

  // ---- 中欄:門牌點地圖(框選 + 清單)-------------------------------------

  function currentFilteredPoints() {
    if (!pdState.selectedNeighborhood) return ALL_POINTS.slice();
    var sel = pdState.selectedNeighborhood;
    return ALL_POINTS.filter(function (p) {
      return p.district === sel.district && p.village === sel.village && p.neighborhood === sel.neighborhood;
    });
  }

  function currentSelectionKeys() {
    return Object.keys(pdState.selection).filter(function (k) { return pdState.selection[k]; });
  }

  function wireMarquee(mapEl, points, container) {
    var dragState = null;
    var marqueeEl = null;

    mapEl.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      var rect = mapEl.getBoundingClientRect();
      dragState = { startX: e.clientX - rect.left, startY: e.clientY - rect.top, rect: rect, w: 0, h: 0, left: 0, top: 0 };
      marqueeEl = document.createElement('div');
      marqueeEl.className = 'pd-marquee';
      marqueeEl.style.left = dragState.startX + 'px';
      marqueeEl.style.top = dragState.startY + 'px';
      marqueeEl.style.width = '0px';
      marqueeEl.style.height = '0px';
      mapEl.appendChild(marqueeEl);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault();
    });

    function onMove(e) {
      if (!dragState) return;
      var x = e.clientX - dragState.rect.left;
      var y = e.clientY - dragState.rect.top;
      x = Math.max(0, Math.min(dragState.rect.width, x));
      y = Math.max(0, Math.min(dragState.rect.height, y));
      var left = Math.min(x, dragState.startX);
      var top = Math.min(y, dragState.startY);
      var w = Math.abs(x - dragState.startX);
      var h = Math.abs(y - dragState.startY);
      marqueeEl.style.left = left + 'px';
      marqueeEl.style.top = top + 'px';
      marqueeEl.style.width = w + 'px';
      marqueeEl.style.height = h + 'px';
      dragState.w = w;
      dragState.h = h;
      dragState.left = left;
      dragState.top = top;
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (!dragState) return;
      var w = dragState.w, h = dragState.h;
      if (w < 4 && h < 4) {
        pdState.selection = {};
        dragState = null;
        draw(container);
        return;
      }
      var rectW = dragState.rect.width, rectH = dragState.rect.height;
      var newSelection = {};
      points.forEach(function (p) {
        var pos = pointPct(p);
        var px = (pos.x / 100) * rectW;
        var py = (pos.y / 100) * rectH;
        if (px >= dragState.left && px <= dragState.left + w && py >= dragState.top && py <= dragState.top + h) {
          newSelection[p.addrKey] = true;
        }
      });
      pdState.selection = newSelection;
      dragState = null;
      draw(container);
    }
  }

  function buildCenterCol(container) {
    var col = document.createElement('div');
    col.className = 'pd-col pd-col-center';

    var filtered = currentFilteredPoints();
    var filterLabel = pdState.selectedNeighborhood
      ? (pdState.selectedNeighborhood.village + ' ' + pdState.selectedNeighborhood.neighborhood)
      : '全部門牌點';

    var head = document.createElement('div');
    head.className = 'pd-col-head';
    head.innerHTML = '<h2>門牌點地圖</h2><p class="hint">篩選:' + esc(filterLabel) + '(' + filtered.length + ' 點)・拖曳框選批次挑選,單擊選單點,Shift+單擊可加選。</p>';
    col.appendChild(head);

    var body = document.createElement('div');
    body.className = 'pd-col-body';
    col.appendChild(body);

    var selectedKeys = currentSelectionKeys();
    var n = selectedKeys.length;

    if (n > 0) {
      var over = n > 50;
      var actionbar = document.createElement('div');
      actionbar.className = 'pd-actionbar';
      var infoSpan = document.createElement('span');
      infoSpan.innerHTML = '已選 <strong>' + n + '</strong> 點';
      actionbar.appendChild(infoSpan);
      var noteSpan = document.createElement('span');
      noteSpan.className = 'hint';
      noteSpan.textContent = '單批最多 50 筆(D11)' + (over ? ' — 已超過上限,無法批次建案' : '');
      actionbar.appendChild(noteSpan);
      var batchBtn = document.createElement('button');
      batchBtn.type = 'button';
      batchBtn.className = 'btn btn-primary';
      batchBtn.textContent = '批次建案(import-from-addr)';
      batchBtn.disabled = over;
      batchBtn.addEventListener('click', function () {
        toast('已示意批次建案:' + n + ' 筆(import-from-addr,未真的寫入)', 'success');
        pdState.selection = {};
        draw(container);
      });
      actionbar.appendChild(batchBtn);
      var clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.className = 'btn ghost';
      clearBtn.textContent = '清除選取';
      clearBtn.addEventListener('click', function () {
        pdState.selection = {};
        draw(container);
      });
      actionbar.appendChild(clearBtn);
      body.appendChild(actionbar);
    }

    var map = document.createElement('div');
    map.className = 'pd-map';
    body.appendChild(map);

    if (!filtered.length) {
      var emptyNote = document.createElement('p');
      emptyNote.className = 'hint';
      emptyNote.textContent = '此鄰目前無門牌點資料(mock 資料僅涵蓋大平村 1–3 鄰,共 18 筆)。';
      body.appendChild(emptyNote);
    }

    filtered.forEach(function (p) {
      var pos = pointPct(p);
      var isSelected = !!pdState.selection[p.addrKey];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pd-point' + (isSelected ? ' is-selected' : '');
      btn.style.left = pos.x.toFixed(1) + '%';
      btn.style.top = pos.y.toFixed(1) + '%';
      btn.title = p.displayAddress;
      btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
      btn.setAttribute('aria-label', p.displayAddress);
      btn.addEventListener('mousedown', function (e) { e.stopPropagation(); });
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (e.shiftKey) {
          if (pdState.selection[p.addrKey]) delete pdState.selection[p.addrKey];
          else pdState.selection[p.addrKey] = true;
        } else {
          pdState.selection = {};
          pdState.selection[p.addrKey] = true;
        }
        draw(container);
      });
      map.appendChild(btn);
    });

    wireMarquee(map, filtered, container);

    if (n === 1) {
      var pt = ALL_POINTS.filter(function (p) { return p.addrKey === selectedKeys[0]; })[0];
      if (pt) {
        var detail = document.createElement('div');
        detail.className = 'pd-detail';
        var infoDiv = document.createElement('div');
        infoDiv.innerHTML = '<strong>' + esc(pt.displayAddress) + '</strong>' +
          '<div class="hint mono">' + esc(pt.district) + ' · ' + esc(pt.village) + ' · ' + esc(pt.neighborhood) + '</div>' +
          '<div class="hint mono">lat ' + pt.lat + ', lng ' + pt.lng + '</div>';
        detail.appendChild(infoDiv);
        var pinBtn = document.createElement('button');
        pinBtn.type = 'button';
        pinBtn.className = 'btn ghost';
        pinBtn.textContent = '手動釘選座標(PATCH coords, geocode_source=manual)';
        pinBtn.addEventListener('click', function () {
          toast('已示意手動釘選「' + pt.displayAddress + '」座標,geocode_source → manual(未真的寫入)', 'success');
        });
        detail.appendChild(pinBtn);
        body.appendChild(detail);
      }
    }

    var listTitle = document.createElement('p');
    listTitle.className = 'hint';
    listTitle.style.margin = '0 0 4px';
    listTitle.textContent = '門牌清單(可勾選複選,鍵盤可操作)';
    body.appendChild(listTitle);

    var list = document.createElement('div');
    list.className = 'pd-list';
    if (!filtered.length) {
      list.innerHTML = '<p class="hint">無資料。</p>';
    }
    filtered.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'pd-list-row';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'pd-chk-' + p.addrKey;
      cb.checked = !!pdState.selection[p.addrKey];
      cb.addEventListener('change', function () {
        if (cb.checked) pdState.selection[p.addrKey] = true;
        else delete pdState.selection[p.addrKey];
        draw(container);
      });
      row.appendChild(cb);
      var label = document.createElement('label');
      label.setAttribute('for', cb.id);
      label.textContent = p.displayAddress;
      row.appendChild(label);
      var badge = document.createElement('span');
      badge.className = 'pd-list-badge';
      badge.textContent = p.neighborhood;
      row.appendChild(badge);
      list.appendChild(row);
    });
    body.appendChild(list);

    return col;
  }

  // ---- 右欄:指派面板 ----------------------------------------------------

  function buildAssignRouteCard(container) {
    var card = document.createElement('div');
    card.className = 'pd-card';
    var n = currentSelectionKeys().length;
    card.innerHTML = '<h3>批次改路線</h3><p class="hint">已選取 <strong>' + n + '</strong> 點/案件。</p>';

    var pick = document.createElement('div');
    pick.className = 'pd-route-pick';
    getAllRoutes().forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'route-chip';
      b.style.background = r.color;
      b.textContent = r.id + ' ' + r.label;
      b.setAttribute('aria-pressed', pdState.chosenRouteId === r.id ? 'true' : 'false');
      b.addEventListener('click', function () {
        pdState.chosenRouteId = (pdState.chosenRouteId === r.id) ? null : r.id;
        draw(container);
      });
      pick.appendChild(b);
    });
    card.appendChild(pick);

    var applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.className = 'btn btn-primary';
    applyBtn.textContent = '套用改路線(示意)';
    applyBtn.addEventListener('click', function () {
      if (!n) { toast('請先在中欄選取至少一個點/案件', 'danger'); return; }
      if (!pdState.chosenRouteId) { toast('請先選擇要指派的路線', 'danger'); return; }
      toast('已示意將 ' + n + ' 點/案件改為路線 ' + pdState.chosenRouteId + '(routes/assign,未真的寫入)', 'success');
      pdState.selection = {};
      pdState.chosenRouteId = null;
      draw(container);
    });
    card.appendChild(applyBtn);

    return card;
  }

  function buildMemberGrantCard(container) {
    ensureMemberGrants();
    var card = document.createElement('div');
    card.className = 'pd-card';
    var headP = document.createElement('div');
    headP.innerHTML = '<h3>成員路線授權</h3><p class="hint">勾選要授權的路線後按「授權」(memberRouteGrants,示意)。僅列出前 6 位成員(demo)。</p>';
    card.appendChild(headP);

    MEMBERS.slice(0, 6).forEach(function (m) {
      var row = document.createElement('div');
      row.className = 'pd-member-row';

      var headRow = document.createElement('div');
      headRow.className = 'pd-member-head';
      var nameSpan = document.createElement('span');
      nameSpan.innerHTML = esc(m.name) + ' <span class="hint mono">' + esc(TEAM_LABELS[m.team] || m.team) + '</span>';
      headRow.appendChild(nameSpan);
      var grantBtn = document.createElement('button');
      grantBtn.type = 'button';
      grantBtn.className = 'btn ghost';
      grantBtn.textContent = '授權';
      headRow.appendChild(grantBtn);
      row.appendChild(headRow);

      var routesWrap = document.createElement('div');
      routesWrap.className = 'pd-member-routes';
      getAllRoutes().forEach(function (r) {
        var lab = document.createElement('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!pdState.memberGrants[m.email][r.id];
        cb.addEventListener('change', function () {
          pdState.memberGrants[m.email][r.id] = cb.checked;
        });
        lab.appendChild(cb);
        var chip = document.createElement('span');
        chip.className = 'route-chip';
        chip.style.background = r.color;
        chip.textContent = r.id;
        lab.appendChild(chip);
        routesWrap.appendChild(lab);
      });
      row.appendChild(routesWrap);

      grantBtn.addEventListener('click', function () {
        var granted = Object.keys(pdState.memberGrants[m.email]).filter(function (k) { return pdState.memberGrants[m.email][k]; });
        toast('已示意更新 ' + m.name + ' 的可用路線為 ' + (granted.length ? granted.join(',') : '(無)') + '(未真的寫入)', 'success');
      });

      card.appendChild(row);
    });

    return card;
  }

  function buildNewRouteCard(container) {
    var card = document.createElement('div');
    card.className = 'pd-card';
    var headP = document.createElement('div');
    headP.innerHTML = '<h3>新增路線</h3><p class="hint">目前 ' + getAllRoutes().length + ' 條路線,色票依 tokens 循環規則自動指派(第 5 條沿用 --route-e,第 6 條起以 hsl 計算新 hue)。</p>';
    card.appendChild(headP);

    var row = document.createElement('div');
    row.className = 'pd-newroute-row';
    var field = document.createElement('div');
    field.className = 'field';
    field.innerHTML = '<label for="pd-new-route-label">路線名稱</label>';
    var input = document.createElement('input');
    input.type = 'text';
    input.id = 'pd-new-route-label';
    input.placeholder = '例:大安里';
    field.appendChild(input);
    row.appendChild(field);

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn btn-primary';
    addBtn.textContent = '新增';
    addBtn.addEventListener('click', function () {
      var label = input.value.trim();
      if (!label) { toast('請輸入路線名稱', 'danger'); return; }
      var nextIndex = getAllRoutes().length + 1;
      var meta = nextRouteMeta(nextIndex);
      pdState.extraRoutes.push({ id: meta.id, label: label, color: meta.color });
      toast('已新增路線 ' + meta.id + ' · ' + label + '(newRoutes,示意)', 'success');
      draw(container);
    });
    row.appendChild(addBtn);
    card.appendChild(row);

    return card;
  }

  function buildRightCol(container) {
    var col = document.createElement('div');
    col.className = 'pd-col pd-col-right';

    var head = document.createElement('div');
    head.className = 'pd-col-head';
    head.innerHTML = '<h2>指派面板</h2><p class="hint">批次改路線 / 成員路線授權 / 新增路線 — 以下皆為 UI 示意。</p>';
    col.appendChild(head);

    var body = document.createElement('div');
    body.className = 'pd-col-body';
    col.appendChild(body);

    body.appendChild(buildAssignRouteCard(container));
    body.appendChild(buildMemberGrantCard(container));
    body.appendChild(buildNewRouteCard(container));

    return col;
  }

  // ---- 主繪製 ------------------------------------------------------------

  function draw(container) {
    ensureStyles();
    container.innerHTML = '';

    var head = document.createElement('div');
    head.innerHTML = '<h2 class="section-title" style="margin-bottom:2px;">規劃桌 — 路線規劃</h2>' +
      '<p class="hint" style="margin:0 0 var(--sp-3);">' + esc(EVENT_SLUG) + ' · 左欄篩選鄰別、中欄框選門牌點、右欄批次指派。以下操作皆為 UI 示意,不會真的寫入後端。</p>';
    container.appendChild(head);

    var workspace = document.createElement('div');
    workspace.className = 'pd-workspace';
    container.appendChild(workspace);

    workspace.appendChild(buildLeftCol(container));
    workspace.appendChild(buildCenterCol(container));
    workspace.appendChild(buildRightCol(container));
  }

  window.VisitProto.registerTab('planning', draw);
})();
</script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // 組織 tab(sysAdmin 專屬,gating 依 VisitPersona.adminScope(persona).org)
  // — 掛載到 VisitProto.registerTab('org', fn)
  //
  // 純前端示意:合心/和氣兩層樹 + 處室字典(CRUD 示意,含 409「使用中保護」
  // /「同名衝突」)、合心/處室管理員任免、系統管理員切換(toggle-admin)。
  // 所有操作只做 UI 回饋(toast),CRUD 只改本檔內的 orgTree 深拷貝,
  // 不寫入 window.VisitMock,避免污染其他 tab 的 mock 狀態。
  // ------------------------------------------------------------------

  if (!window.VisitMock || !window.VisitProto || !window.VisitPersona) return;

  // ---- 本地複本(深拷貝,CRUD 只改這份，不動 window.VisitMock.ORG_TREE)----

  function deepClone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  var orgTree = deepClone(window.VisitMock.ORG_TREE || { hexin: [], depts: [] });
  var nextHeqiId = 900;
  var nextDeptId = 900;

  // ---- 「使用中」判定 --------------------------------------------------
  // 比對 DIRECTORY 單位字串是否引用該節點名稱、以及 PERSONAS 真值表裡
  // 的 hexinAdminOf / deptAdminOf 是否指向該節點 id — 示意「有人隸屬 /
  // 已被任命管理」則不可停用。純示意用的簡化規則，非真實後端邏輯。
  // ------------------------------------------------------------------

  function computeInUse() {
    var units = [];
    var dir = window.VisitMock.DIRECTORY || {};
    Object.keys(dir).forEach(function (g) {
      (dir[g] || []).forEach(function (person) {
        if (person.orgUnit) units.push(person.orgUnit);
      });
    });

    var hexinAdminIds = {};
    var deptAdminIds = {};
    (window.VisitPersona.PERSONAS || []).forEach(function (p) {
      var sig = p.adminSignal || {};
      (sig.hexinAdminOf || []).forEach(function (id) { hexinAdminIds[id] = true; });
      (sig.deptAdminOf || []).forEach(function (id) { deptAdminIds[id] = true; });
    });

    function nameReferenced(name) {
      return units.some(function (u) { return u.indexOf(name) !== -1; });
    }

    orgTree.hexin.forEach(function (h) {
      if (h.active === undefined) h.active = true;
      h.inUse = nameReferenced(h.name) || !!hexinAdminIds[h.id];
      (h.heqi || []).forEach(function (q) {
        if (q.active === undefined) q.active = true;
        q.inUse = nameReferenced(q.name);
      });
    });
    (orgTree.depts || []).forEach(function (d) {
      if (d.active === undefined) d.active = true;
      d.inUse = nameReferenced(d.name) || !!deptAdminIds[d.id];
    });
  }

  computeInUse();

  // ---- UI 狀態(存於記憶體，重新整理即重置)------------------------------

  var uiState = {
    expandedHexin: {},   // hexinId -> bool
    addingHeqiFor: null,  // hexinId | null
    addingDept: false,
    renameTarget: null    // { kind: 'hexin'|'heqi'|'dept', id, hexinId }
  };
  orgTree.hexin.forEach(function (h) { uiState.expandedHexin[h.id] = true; });

  var appointState = { personEmail: '', targetKey: '' };

  // ---- 系統管理員切換狀態 ------------------------------------------------
  // 「自己」沿用與事件管理 tab 相同的示意慣例：名冊中第一位事件管理員。

  var SELF_EMAIL = (window.VisitMock.MEMBERS.filter(function (m) { return m.isEventAdmin; })[0] || {}).email;
  var isAdminState = {};
  window.VisitMock.MEMBERS.forEach(function (m) {
    isAdminState[m.email] = m.email === SELF_EMAIL || m.email === 'chen.admin@charity.org.tw';
  });

  // ---- 小工具 ------------------------------------------------------------

  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function toast(message, kind) {
    var stack = document.getElementById('toast-stack');
    if (!stack) return;
    var t = document.createElement('div');
    t.className = 'toast' + (kind ? ' toast--' + kind : '');
    t.textContent = message;
    stack.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function findHexin(id) {
    return orgTree.hexin.filter(function (h) { return String(h.id) === String(id); })[0] || null;
  }
  function findHeqi(hexinId, id) {
    var h = findHexin(hexinId);
    if (!h) return null;
    return (h.heqi || []).filter(function (q) { return String(q.id) === String(id); })[0] || null;
  }
  function findDept(id) {
    return orgTree.depts.filter(function (d) { return String(d.id) === String(id); })[0] || null;
  }

  function siblingNames(list, excludeId) {
    return list
      .filter(function (n) { return excludeId == null || String(n.id) !== String(excludeId); })
      .map(function (n) { return n.name.trim().toLowerCase(); });
  }

  }

  // ---- 權限保護擋卡(雙保險 — 殼理論上已 gate)------------------------------

  function buildBlockedCard(persona) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<h2 class="section-title">僅系統管理員可用</h2>' +
      '<p class="hint">目前身分「' + esc(persona.label) + '」沒有組織管理權限，無法檢視合心/和氣樹、' +
      '處室字典、管理員任免與系統管理員切換。</p>' +
      '<p class="hint">此頁需 <code class="mono">VisitPersona.adminScope(persona).org === true</code>。' +

  // ---- 內用表單元件 --------------------------------------------------------

  function buildInlineForm(opts) {
    // opts: { label, value, submitLabel, onSubmit(name), onCancel() }
    var row = document.createElement('div');
    row.className = 'org-inline-form';

    if (opts.label) {
      var labelSpan = document.createElement('span');
      labelSpan.className = 'hint';
      labelSpan.textContent = opts.label;
      row.appendChild(labelSpan);
    }

    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '輸入名稱';
    input.value = opts.value || '';
    row.appendChild(input);

    var okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.className = 'btn btn-primary';
    okBtn.textContent = opts.submitLabel || '確認';
    okBtn.addEventListener('click', function () { opts.onSubmit(input.value); });
    row.appendChild(okBtn);

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn ghost';
    cancelBtn.textContent = '取消';
    cancelBtn.addEventListener('click', opts.onCancel);
    row.appendChild(cancelBtn);

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); opts.onSubmit(input.value); }
      if (e.key === 'Escape') { e.preventDefault(); opts.onCancel(); }
    });

    setTimeout(function () { input.focus(); input.select(); }, 0);

    return row;
  }

  // ---- 組織樹(合心 / 和氣)-------------------------------------------------

  function statusBadgeHtml(node) {
    if (!node.active) return '<span class="badge badge--muted">已停用</span>';
    if (node.inUse) return '<span class="badge badge--warning">使用中</span>';
    return '<span class="badge">可停用</span>';
  }

  function deactivateNode(node, label, container) {
    if (!node.active) return;
    if (node.inUse) {
      toast('409 — 「' + label + '」仍有成員隸屬，無法停用', 'danger');
      return;
    }
    node.active = false;
    toast('已示意停用「' + label + '」(未寫回)', 'success');
    draw(container);
  }

  function renameNode(kind, id, hexinId, rawName, container) {
    var name = String(rawName || '').trim();
    if (!name) { toast('請輸入名稱', 'danger'); return; }

    var node, siblings;
    if (kind === 'hexin') {
      node = findHexin(id);
      siblings = siblingNames(orgTree.hexin, id);
    } else if (kind === 'heqi') {
      var h = findHexin(hexinId);
      node = h ? findHeqi(hexinId, id) : null;
      siblings = h ? siblingNames(h.heqi || [], id) : [];
    } else {
      node = findDept(id);
      siblings = siblingNames(orgTree.depts, id);
    }
    if (!node) { toast('找不到節點', 'danger'); return; }

    if (siblings.indexOf(name.toLowerCase()) !== -1) {
      toast('409 duplicate_name — 「' + name + '」與同層級名稱重複', 'danger');
      return;
    }

    var oldName = node.name;
    node.name = name;
    computeInUse();
    uiState.renameTarget = null;
    toast('已示意將「' + oldName + '」改名為「' + name + '」(未寫回)', 'success');
    draw(container);
  }

  function addHeqi(h, rawName, container) {
    var name = String(rawName || '').trim();
    if (!name) { toast('請輸入和氣名稱', 'danger'); return; }
    if (siblingNames(h.heqi || [], null).indexOf(name.toLowerCase()) !== -1) {
      toast('409 duplicate_name — 「' + name + '」與現有和氣同名', 'danger');
      return;
    }
    nextHeqiId += 1;
    h.heqi = h.heqi || [];
    h.heqi.push({ id: nextHeqiId, name: name, active: true, inUse: false });
    uiState.addingHeqiFor = null;
    uiState.expandedHexin[h.id] = true;
    toast('已示意新增和氣「' + name + '」於「' + h.name + '」下(未寫回)', 'success');
    draw(container);
  }

  function buildHeqiNode(h, q, container) {
    var wrap = document.createElement('div');
    wrap.className = 'org-node org-depth-1';

    var rt = uiState.renameTarget;
    if (rt && rt.kind === 'heqi' && String(rt.id) === String(q.id) && String(rt.hexinId) === String(h.id)) {
      wrap.appendChild(buildInlineForm({
        value: q.name,
        submitLabel: '儲存',
        onSubmit: function (name) { renameNode('heqi', q.id, h.id, name, container); },
        onCancel: function () { uiState.renameTarget = null; draw(container); }
      }));
      return wrap;
    }

    var row = document.createElement('div');
    row.className = 'org-row';

    var name = document.createElement('span');
    name.className = 'org-name';
    name.innerHTML = esc(q.name) + statusBadgeHtml(q);
    row.appendChild(name);

    var actions = document.createElement('div');
    actions.className = 'org-row-actions';

    var renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'btn ghost';
    renameBtn.textContent = '改名';
    renameBtn.setAttribute('aria-label', '改名 · ' + q.name);
    renameBtn.addEventListener('click', function () {
      uiState.renameTarget = { kind: 'heqi', id: q.id, hexinId: h.id };
      uiState.addingHeqiFor = null;
      draw(container);
    });
    actions.appendChild(renameBtn);

    var deactivateBtn = document.createElement('button');
    deactivateBtn.type = 'button';
    deactivateBtn.className = 'btn ghost';
    deactivateBtn.textContent = q.active ? '停用' : '已停用';
    deactivateBtn.disabled = !q.active;
    deactivateBtn.setAttribute('aria-label', (q.active ? '停用' : '已停用') + ' · ' + q.name);
    if (q.active && q.inUse) deactivateBtn.title = '仍有成員隸屬，停用會回傳 409';
    deactivateBtn.addEventListener('click', function () {
      deactivateNode(q, q.name, container);
    });
    actions.appendChild(deactivateBtn);

    row.appendChild(actions);
    wrap.appendChild(row);
    return wrap;
  }

  function buildHexinNode(h, container) {
    var wrap = document.createElement('div');
    wrap.className = 'org-node';

    var rt = uiState.renameTarget;
    if (rt && rt.kind === 'hexin' && String(rt.id) === String(h.id)) {
      wrap.appendChild(buildInlineForm({
        value: h.name,
        submitLabel: '儲存',
        onSubmit: function (name) { renameNode('hexin', h.id, null, name, container); },
        onCancel: function () { uiState.renameTarget = null; draw(container); }
      }));
    } else {
      var row = document.createElement('div');
      row.className = 'org-row';

      var expanded = !!uiState.expandedHexin[h.id];
      var caret = document.createElement('button');
      caret.type = 'button';
      caret.className = 'org-caret';
      caret.setAttribute('aria-expanded', String(expanded));
      caret.setAttribute('aria-label', (expanded ? '收合' : '展開') + ' ' + h.name);
      caret.textContent = expanded ? '▾' : '▸';
      caret.addEventListener('click', function () {
        uiState.expandedHexin[h.id] = !expanded;
        draw(container);
      });
      row.appendChild(caret);

      var name = document.createElement('span');
      name.className = 'org-name';
      name.innerHTML = esc(h.name) + statusBadgeHtml(h);
      row.appendChild(name);

      var actions = document.createElement('div');
      actions.className = 'org-row-actions';

      var addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn ghost';
      addBtn.textContent = '新增和氣';
      addBtn.disabled = !h.active;
      addBtn.setAttribute('aria-label', '新增和氣 · 上層 ' + h.name);
      addBtn.addEventListener('click', function () {
        uiState.addingHeqiFor = h.id;
        uiState.renameTarget = null;
        uiState.expandedHexin[h.id] = true;
        draw(container);
      });
      actions.appendChild(addBtn);

      var renameBtn = document.createElement('button');
      renameBtn.type = 'button';
      renameBtn.className = 'btn ghost';
      renameBtn.textContent = '改名';
      renameBtn.setAttribute('aria-label', '改名 · ' + h.name);
      renameBtn.addEventListener('click', function () {
        uiState.renameTarget = { kind: 'hexin', id: h.id };
        uiState.addingHeqiFor = null;
        draw(container);
      });
      actions.appendChild(renameBtn);

      var deactivateBtn = document.createElement('button');
      deactivateBtn.type = 'button';
      deactivateBtn.className = 'btn ghost';
      deactivateBtn.textContent = h.active ? '停用' : '已停用';
      deactivateBtn.disabled = !h.active;
      deactivateBtn.setAttribute('aria-label', (h.active ? '停用' : '已停用') + ' · ' + h.name);
      if (h.active && h.inUse) deactivateBtn.title = '仍有成員隸屬，停用會回傳 409';
      deactivateBtn.addEventListener('click', function () {
        deactivateNode(h, h.name, container);
      });
      actions.appendChild(deactivateBtn);

      row.appendChild(actions);
      wrap.appendChild(row);
    }

    if (uiState.addingHeqiFor === h.id) {
      wrap.appendChild(buildInlineForm({
        label: '新增和氣 · 上層 ' + h.name,
        submitLabel: '新增',
        onSubmit: function (name) { addHeqi(h, name, container); },
        onCancel: function () { uiState.addingHeqiFor = null; draw(container); }
      }));
    }

    if (uiState.expandedHexin[h.id]) {
      (h.heqi || []).forEach(function (q) {
        wrap.appendChild(buildHeqiNode(h, q, container));
      });
    }

    return wrap;
  }

  function buildOrgTreeCard(container) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<h2 class="section-title">組織樹 — 合心 / 和氣</h2>' +
      '<p class="section-sub">CRUD 皆為 UI 示意(toast)，不會寫回資料。停用「使用中」節點或新增同名節點會出現 409 提示。</p>';

    var list = document.createElement('div');
    list.className = 'stack-sm';
    list.style.marginTop = 'var(--sp-3)';

    if (!orgTree.hexin.length) {
      var empty = document.createElement('p');
      empty.className = 'hint';
      empty.textContent = '無合心資料。';
      list.appendChild(empty);
    } else {
      orgTree.hexin.forEach(function (h) {
        list.appendChild(buildHexinNode(h, container));
      });
    }

    card.appendChild(list);
    return card;
  }

  // ---- 處室字典 -------------------------------------------------------

  function addDept(rawName, container) {
    var name = String(rawName || '').trim();
    if (!name) { toast('請輸入處室名稱', 'danger'); return; }
    if (siblingNames(orgTree.depts, null).indexOf(name.toLowerCase()) !== -1) {
      toast('409 duplicate_name — 「' + name + '」與現有處室同名', 'danger');
      return;
    }
    nextDeptId += 1;
    orgTree.depts.push({ id: nextDeptId, name: name, active: true, inUse: false });
    uiState.addingDept = false;
    toast('已示意新增處室「' + name + '」(未寫回)', 'success');
    draw(container);
  }
